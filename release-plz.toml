# release-plz — versioning, changelogs and publishing for this workspace.
#
# The model: merge PRs to main freely. release-plz watches main and keeps a
# single "Release PR" up to date with the version bumps and changelog entries
# those merges imply. Merging THAT PR is the release — it tags each crate and
# publishes to crates.io. Nothing else publishes.
#
# So merging a feature PR never releases anything, and a release is a reviewable
# diff rather than a side effect. See RELEASING.md.
#
# WHAT GETS PUBLISHED is decided in each crate's Cargo.toml, not here: 26
# crates have `publish` inherited from `[workspace.package]`, and the other 9
# set `publish = false` with a comment saying why (RELEASING.md lists both).
# release-plz honours that — it still updates an unpublished crate's version and
# dependency requirements (so the workspace stays coherent when a published
# dependency bumps), it just never uploads it. Keeping the decision in the manifests means `cargo` and
# release-plz cannot disagree about it.

[workspace]
# Changelog entries come from conventional commits via git-cliff. There are no
# changelog fragment files any more: the commit message IS the entry, so there
# is nothing for two concurrent PRs to conflict over.
changelog_config = "cliff.toml"

# Bump sizes come from conventional commits (a `!` title is a breaking bump),
# not from release-plz's own cargo-semver-checks run. The API check is CI's
# `release bump is large enough` on the Release PR (scripts/semver-report.sh,
# enforce mode), which blocks a bump that is too small and names the crate and
# the version it needs.
#
# release-plz's check was switched off because it was the slow half of a check
# made twice. It semver-checked every changed crate on every merge to main —
# each check a cold rustdoc build of the crate's dependency tree, twice — one at
# a time so the runner would not run out of memory: 40-135 minutes per
# regeneration, restarted by every merge. And it was not the authority: it
# proposed too-small bumps (vti-common 0.16.2, vta-sdk 0.32.4 on 2026-09-05)
# that the guard exists to catch. The guard ran the same checks again on the
# Release PR. Now only the guard runs them, and skips every crate whose
# proposed version is already a breaking bump.
semver_check = false

# One GitHub Release per published crate, carrying that crate's changelog
# section. This is what an external consumer lands on from crates.io.
git_release_enable = true

# Label the Release PR so it is obvious in the queue and easy to filter.
pr_labels = ["release"]

# Publishing runs `cargo publish` per crate in dependency order, verify build
# included. vtc-service once needed `--no-verify` here because its build.rs
# npm-built the admin UI into the source tree, which cargo rejects. It no longer
# does either: the package carries the web bundles pre-built (publish.yml runs
# `scripts/build-vtc-web-bundles.sh` first), and build.rs bakes those without
# touching npm when it finds no `admin-ui/package.json`.


# Which crates the API check covers is `EXCLUDED` in scripts/semver-report.sh:
# the twelve subsystem crates and vtc-service, whose APIs have no consumer.
#
# vtc-service is published as a binary, for `cargo install vtc-service`.
# `publish_allow_dirty`: cargo counts gitignored files that `include` names as
# uncommitted, and the package's two web bundles are exactly that (built by
# publish.yml just before this runs). Without it `cargo publish` refuses
# vtc-service with "154 files in the working directory contain changes". The
# step that builds them also checks the tree is otherwise clean, so this admits
# the bundles and nothing else.
[[package]]
name = "vtc-service"
publish_allow_dirty = true
