# release-plz — versioning, changelogs and publishing for this workspace.
#
# The model: merge PRs to main freely. release-plz watches main and keeps a
# single "Release PR" up to date with the version bumps and changelog entries
# those merges imply. Merging THAT PR is the release — it tags each crate and
# publishes to crates.io. Nothing else publishes.
#
# So merging a feature PR never releases anything, and a release is a reviewable
# diff rather than a side effect. See RELEASING.md.
#
# WHAT GETS PUBLISHED is decided in each crate's Cargo.toml, not here: 20 crates
# have `publish` inherited from `[workspace.package]`, and the other 6 set
# `publish = false` with a comment saying why. release-plz honours that — it
# still updates an unpublished crate's version and dependency requirements (so
# the workspace stays coherent when a published dependency bumps), it just never
# uploads it. Keeping the decision in the manifests means `cargo` and
# release-plz cannot disagree about it.

[workspace]
# Changelog entries come from conventional commits via git-cliff. There are no
# changelog fragment files any more: the commit message IS the entry, so there
# is nothing for two concurrent PRs to conflict over.
changelog_config = "cliff.toml"

# Compare each crate's public API against its published version and force a
# compatibility-breaking bump when it actually broke — rather than trusting an
# author to notice. This is the check the old hand-rolled flow could not make.
#
# On by default, and switched OFF per-crate below for the twelve subsystem
# crates. See that block for why.
semver_check = true

# One GitHub Release per published crate, carrying that crate's changelog
# section. This is what an external consumer lands on from crates.io.
git_release_enable = true

# Label the Release PR so it is obvious in the queue and easy to filter.
pr_labels = ["release"]

# Publishing runs `cargo publish` per crate in dependency order. vtc-service
# used to need `--no-verify` here because its build.rs npm-builds an admin UI
# and cargo rejects a build.rs that modifies the source tree — that special
# case is gone with `publish = false` on that crate.


# ── semver checks: on where the API has a consumer ───────────────────────────
#
# The twelve subsystem crates are on crates.io for one reason: crates.io
# requires a published crate's whole dependency closure to be published, and
# `vta-service` is published (for OpenVTC's `MockVta` harness — see
# RELEASING.md). Nothing depends on their APIs directly, in this workspace or
# outside it; they are reached through `vta-service`, which re-exports them.
#
# Checking an API nobody consumes costs real time on EVERY pull request:
# `cargo semver-checks --workspace` builds rustdoc JSON for each crate twice,
# current and baseline. Adding these took the job from ~17 minutes to over 35.
# That is a tax on every PR in the repo, paid for a signal no consumer can act
# on.
#
# `vta-service` itself keeps the check: it has a real consumer
# (`openvtc-core`'s dev-dependency), so a silent break there reaches somebody.
# So do the seven crates with external consumers, via the workspace default.
#
# Bump size for these falls back to conventional commits, which is what it was
# before they were ever published. If one of them grows a direct consumer,
# delete its entry here.
[[package]]
name = "vta-audit"
semver_check = false

[[package]]
name = "vta-backup"
semver_check = false

[[package]]
name = "vta-config"
semver_check = false

[[package]]
name = "vta-keys"
semver_check = false

[[package]]
name = "vta-keyspaces"
semver_check = false

[[package]]
name = "vta-policy"
semver_check = false

[[package]]
name = "vta-support"
semver_check = false

[[package]]
name = "vta-sweepers"
semver_check = false

[[package]]
name = "vta-tee"
semver_check = false

[[package]]
name = "vta-vault"
semver_check = false

[[package]]
name = "vta-webvh"
semver_check = false

[[package]]
name = "vti-webauthn"
semver_check = false

# ── vti-secrets: the baseline cannot be built, temporarily ───────────────────
#
# Not "checking this costs too much" like the block above — this check is
# **impossible right now**, and it is impossible for a reason that ends by
# itself.
#
# `cargo-semver-checks` builds each crate's *published* baseline with all
# features. `vti-secrets 0.3.7` on crates.io declares `aws-config` and
# `aws-sdk-secretsmanager` and **no `aws-smithy-types`** — the `>=1.6.1, <1.7`
# bound in the workspace manifest landed in #1485, after 0.3.7 went out. So the
# baseline resolves `aws-smithy-types 1.7.0`, and `aws-smithy-json 0.63` does
# not compile against it:
#
#   error[E0308]: expected `DocumentObject`, found `HashMap<String, Document>`
#   error[E0004]: non-exhaustive patterns: `&_` not covered
#   error: failed to build rustdoc for crate vti-secrets v0.3.7
#
# Which is a deadlock: the baseline builds once a `vti-secrets` carrying the
# bound is published, and publishing needs the Release PR that this check was
# blocking. Sixteen runs had already failed for an unrelated reason (#1491);
# this was the wall behind that one.
#
# **Delete this entry after the first release that publishes `vti-secrets`.**
# At that point the baseline is ≥ 0.3.8, it carries the bound, it builds, and
# the check works again — nothing else needs to change. It is scoped to this one
# crate deliberately: `vta-service` reaches `aws-config` too, but its baseline
# builds (verified against a cold `cargo-semver-checks` cache — a warm one hides
# this class of failure entirely), and the other checked crates do not reach the
# AWS stack at all.
[[package]]
name = "vti-secrets"
semver_check = false
