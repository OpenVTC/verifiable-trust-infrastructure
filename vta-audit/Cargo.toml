[package]
name = "vta-audit"
description = "Structured audit logging for the VTA — the `audit!` tracing macro plus the audit-keyspace persistence helpers"
readme = "README.md"
version = "0.1.2"
edition.workspace = true
# Internal to this workspace — consumed through path dependencies only, never
# from crates.io. It was published by inheritance from `[workspace.package]`
# rather than by decision; the audit in #938 found no external consumer. See
# RELEASING.md ("What gets published").
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vti-common = { path = "../vti-common", version = "0.11" }
vta-sdk = { path = "../vta-sdk", version = "0.23" }
tracing = { workspace = true }
uuid = { workspace = true }
