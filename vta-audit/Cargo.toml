[package]
name = "vta-audit"
description = "Structured audit logging for the VTA — the `audit!` tracing macro plus the audit-keyspace persistence helpers"
readme = "README.md"
version = "0.3.6"
edition.workspace = true
# Published, because `vta-service` is — and a crate cannot go to crates.io
# without its whole dependency closure there too. Not published for its own
# sake: nothing outside this workspace is expected to depend on it directly.
#
# #938 set `publish = false` here on the finding that no external consumer
# existed. That was wrong by one: `openvtc-core` dev-depends on `vta-service`
# for `test_support::MockVta`, an in-process VTA the OpenVTC end-to-end tests
# run against. See `vta-service/Cargo.toml` for what unpublishing it actually
# broke. See RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vti-common = { path = "../vti-common", version = "0.18" }
vta-sdk = { path = "../vta-sdk", version = "0.36" }
async-trait = "0.1"
chrono = { workspace = true }
hex = { workspace = true }
# A facade, not an exporter: `record_best_effort` counts failed audit writes so
# a deployment can alert on "the audit log stopped accepting entries". With no
# recorder installed (the offline CLIs, tests) incrementing is a no-op, so this
# costs nothing where nothing is scraping. The Prometheus exporter stays in
# `vta-service`, which is where the HTTP surface is.
metrics = "0.24"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
# So the "a failed sink is reported" test can assert on what was logged. The
# point of `record_best_effort` is the log line, and a test that only checked
# the function returned would pass with the line deleted.
tracing-subscriber = { workspace = true }
