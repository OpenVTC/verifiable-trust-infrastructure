[package]
name = "vtc-client"
description = "Client SDK for Verifiable Trust Communities (VTC) — auth, members, join, removal, policies"
version = "0.5.6"
edition.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true

[features]
default = []
# The MLS group layer and record sealing, re-exported from `vti-rooms` where
# they now live. Still off by default here, and still the same types — a caller
# that had `vtc-client` with `mls` keeps working unchanged.
mls = ["vti-rooms/mls"]

# Reach a VTC over DIDComm instead of HTTPS.
#
# Off by default because it is not free: it pulls the VTA SDK's client and the
# TDK messaging stack behind it, which a REST-only operator tool has no use for.
# On, the holder verbs — the ones addressed to the document endpoint — can go
# over a mediated DIDComm session instead of a URL, which is what a `did:webvh`
# persona behind a mediator actually has.
#
# The transports are **delegated, not reimplemented**: `vta_sdk::client::VtaClient`
# already owns session setup, `thid` demultiplexing, retry and reply-proof
# verification, and a second copy of that in this crate would be a second thing
# to keep correct.
didcomm = ["vta-sdk/client", "vta-sdk/didcomm"]
# The same, over TSP. Additive to `didcomm`: a TSP leg rides an existing DIDComm
# session rather than replacing it (VTI #803/#810).
tsp = ["didcomm", "vta-sdk/tsp"]

[dependencies]
# Reuses the VTA SDK's challenge-response auth (audience-agnostic) and the
# published join-request protocol types. `session` gates `auth_light` +
# `protocols`.
vta-sdk = { path = "../vta-sdk", version = "0.35", features = ["session"] }

# The room's wire types, and — under the `mls` feature — its group-key and
# sealing layers, which this crate re-exports rather than owning. A VTA needs
# both and must not depend on a VTC client, so they live in the shared leaf.
vti-rooms = { path = "../vti-rooms", version = "0.2" }

# `TrustTask` — the join-submit document this client signs, and the `#response`
# envelope the VTC answers it with. Same crate `vta-sdk` builds the document
# from, so one shape crosses the boundary.
trust-tasks-rs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
