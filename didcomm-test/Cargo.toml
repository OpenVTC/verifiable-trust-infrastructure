[package]
name = "didcomm-test"
description = "Standalone DIDComm connectivity test — mimics VTA TEE key + messaging flow"
readme = "README.md"
version = "0.6.9"
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "didcomm-test"
path = "src/main.rs"

[dependencies]
vta-sdk = { path = "../vta-sdk", version = "0.27", features = ["didcomm", "crypto-provider"] }
affinidi-tdk = { workspace = true }
affinidi-did-resolver-cache-sdk = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
multibase = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
# SLIP-0010 key derivation (`vti_common::slip10`) — the harness re-derives the
# same keys the VTA does, from the same seed and paths.
vti-common = { path = "../vti-common", version = "0.13" }

[lints]
workspace = true
