[package]
name = "vti-vetting-pcs"
description = "Hidden-vetter admission (ZKP) on the Predicate Credential System: the community's issuer and verifier, and the member-side vetter and applicant engines a VTA runs"
readme = "README.md"
version = "0.1.1"
edition.workspace = true
# Published, because `vta-service` is: the VTA runs the member-side engines as
# its principal's PCS engine (the `vta/pcs/*` Trust Tasks), and a crate cannot
# go to crates.io without its whole dependency closure there too. See
# RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `vtc::Vtc`, an in-process community built from the issuer and verifier, for
# driving the member-side engines end to end in tests without a running VTC.
harness = []

[dependencies]
predicate-credential-system = { version = "0.1", features = ["serde"] }
ark-bls12-381 = { version = "0.6.0", default-features = false, features = ["curve", "std"] }
ark-ec = { version = "0.6.0", default-features = false, features = ["std"] }
ark-ff = { version = "0.6.0", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6.0", default-features = false, features = ["std"] }
# MUST stay 0.8, whatever the workspace pins: `ark_std::rand` re-exports rand 0.8
# and the randomized algorithms take its traits.
rand = { version = "0.8", features = ["std", "std_rng", "getrandom"] }
# Pairs with rand 0.8. Used for ONE thing: deriving a community's keys from a
# secret over a specified stream, so the same secret gives the same keys on any
# build (`issuer::Issuer::derive`).
rand_chacha = "0.3"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
# The counting rule the VTC already uses: `requirements::evaluate` and
# `StatementFacts`, unchanged.
vta-sdk = { path = "../vta-sdk", version = "0.69", features = ["vetting"] }

[dev-dependencies]
rand = { version = "0.8", features = ["std", "std_rng"] }
# The end-to-end tests drive the member-side engines against `vtc::Vtc`.
vti-vetting-pcs = { path = ".", features = ["harness"] }
