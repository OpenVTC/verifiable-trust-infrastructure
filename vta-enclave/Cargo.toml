[package]
name = "vta-enclave"
description = "VTA binary for AWS Nitro Enclaves (TEE mode)"
readme = "README.md"
version = "0.7.7"
edition.workspace = true
# `vta-enclave` is a Linux-only Nitro Enclave binary (vsock-store depends
# on `tokio-vsock`). Publishing to crates.io would surface "fails on
# macOS/Windows" issues to operators who only need the library crates;
# the binary is consumed via the deploy pipeline, not `cargo install`.
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vta-enclave"
path = "src/main.rs"

[features]
default = ["rest", "didcomm"]
rest = ["vta-service/rest"]
didcomm = ["vta-service/didcomm"]
# TSP transport pass-through. Off by default (not in `default`); enable
# explicitly for a TSP-capable enclave build once the transport lands.
tsp = ["vta-service/tsp"]
webvh = ["vta-service/webvh"]
vsock-store = ["vta-service/vsock-store"]
vsock-log = ["dep:tokio-vsock"]
# Fleet (`BAKE_CONFIG=false`) build: fetch + apply the allowlisted tenant-config
# overlay over vsock at boot. Off by default, so a self-host/baked build's
# binary contains no vsock config-fetch code. See design note §3.1/§3.8.
tenant-overlay = ["dep:vta-tee", "vta-tee/tenant-overlay"]

[dependencies]
vta-service = { path = "../vta-service", version = "0.23", default-features = false, features = ["tee"] }
vti-common = { path = "../vti-common", version = "0.17", features = ["encryption"] }
# Direct dep only for the `tenant-overlay` fetch entry point; the rest of the
# TEE bootstrap is reached through `vta_service::tee`. Optional so a baked build
# links no overlay code.
vta-tee = { path = "../vta-tee", version = "0.2", optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
tokio-vsock = { workspace = true, optional = true }

[lints]
workspace = true
