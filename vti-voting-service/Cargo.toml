[package]
name = "vti-voting-service"
description = "The voting service: a ballot box and board for community elections, shared by any number of communities, that never learns who voted"
version = "0.1.0"
edition.workspace = true
# A host service binary, like vti-witness and room-host: nothing consumes it as
# a library, so there is nothing to publish.
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vti-voting-service"
path = "src/main.rs"

[dependencies]
vti-voting = { path = "../vti-voting" }
# `host_session`: the service identity's mediator session, TSP and DIDComm on it.
vti-common = { path = "../vti-common", version = "0.65", features = ["host-session"] }
async-trait = { workspace = true }
# As vti-witness: `provision-client` for the VTA-provisioned identity
# (`run_phase1_init`, the `ballot-box` template), `tsp` for the binding
# envelope, `didcomm` for `did_key::secrets_from_bundle`, and (through
# `provision-client`) `trust_task_sign` and the proof verifier.
vta-sdk = { path = "../vta-sdk", version = "0.89", features = [
  "didcomm",
  "provision-client",
  "tsp",
  "crypto-provider",
] }
vti-secrets = { path = "../vti-secrets", version = "0.38" }
trust-tasks-rs = { workspace = true }
# The receive pipeline every Trust Task service shares (#2576): size, freshness, recipient, the
# task's own published policy, proof, sender binding, the duplicate-id record, signed answers.
vti-trust-task-server = { path = "../vti-trust-task-server", version = "0.11" }
# The pinned `voting/*` versions: the routing table names each by its generated payload type,
# and the pipeline reads each task's policy from the index (CLAUDE.md, "Pinning a task version").
vti-specs = { path = "../vti-specs", version = "0.14" }
affinidi-did-resolver-cache-sdk = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
multibase = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde_ignored = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

[lints]
workspace = true
