[package]
name = "vti-voting-service"
description = "The voting service: a ballot box and board for community elections, shared by any number of communities, that never learns who voted"
version = "0.1.0"
edition.workspace = true
# A host service binary, like vti-witness and room-host: nothing consumes it as
# a library, and it depends on vti-voting, which is unpublished until its first
# published consumer.
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vti-voting-service"
path = "src/main.rs"

[dependencies]
vti-voting = { path = "../vti-voting" }
# `host_session`: the service identity's mediator session, TSP and DIDComm on it.
vti-common = { path = "../vti-common", version = "0.49", features = ["host-session"] }
async-trait = "0.1"
# As vti-witness: `provision-client` for the VTA-provisioned identity
# (`run_phase1_init`, the `ballot-box` template), `tsp` for the binding
# envelope, `didcomm` for `did_key::secrets_from_bundle`, and (through
# `provision-client`) `trust_task_sign` and the proof verifier.
vta-sdk = { path = "../vta-sdk", version = "0.73", features = [
  "didcomm",
  "provision-client",
  "tsp",
  "crypto-provider",
] }
vti-secrets = { path = "../vti-secrets", version = "0.22" }
trust-tasks-rs = { workspace = true }
affinidi-did-resolver-cache-sdk = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
multibase = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
anyhow = "1"
toml = { workspace = true }
serde_ignored = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
