[package]
name = "vti-voting-service"
description = "The voting service: a ballot box and board for community elections, shared by any number of communities, that never learns who voted"
version = "0.1.0"
edition.workspace = true
# A host service binary, like vti-witness and room-host: nothing consumes it as
# a library, and it depends on vti-voting, which is unpublished until its first
# published consumer.
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vti-voting-service"
path = "src/main.rs"

[dependencies]
vti-voting = { path = "../vti-voting" }
vti-common = { path = "../vti-common", version = "0.48" }
vta-sdk = { path = "../vta-sdk", version = "0.72", features = ["client"] }
trust-tasks-rs = { workspace = true }
affinidi-did-resolver-cache-sdk = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
multibase = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
