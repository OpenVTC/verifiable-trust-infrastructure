# cargo-deny configuration.
#
# Run with:
#   cargo install cargo-deny
#   cargo deny check
#
# Primary purpose today: advisory suppression with documented justification.
# The ignored GHSAs below are all (a) transitive-only, (b) low severity, and
# (c) unpatched in the upstream major version we currently depend on. Each
# entry states the attack surface, why it does not apply to our workloads,
# and the upstream condition that would let us drop the ignore.

[graph]
# Scan the graph with every feature on, not just the default set.
#
# This is a coverage fix, not a preference. The AWS SDK stack — and with it
# `hyper` 0.14, `h2` 0.3 and `rustls` 0.21, which is where most of the ignores
# below point — reaches the graph only through the `tee` feature. A
# default-feature scan therefore never sees those crates, so it was neither
# enforcing the ignores nor, more importantly, able to catch a NEW advisory
# anywhere in that path. The advisories most worth catching were the ones not
# being checked.
#
# The visible symptom was cargo-deny reporting most of the list below as
# `advisory-not-detected` — which reads as "these are stale, delete them" and
# is exactly the wrong conclusion: they are live, just out of frame. Turning
# this on makes the warning mean what it says, so a genuinely stale entry
# stands out instead of hiding among false ones.
all-features = true

[advisories]
version = 2
ignore = [

  { id = "RUSTSEC-2023-0071", reason = """
  rsa 0.9 "Marvin Attack": decrypting or signing with an RSA *private* key
  leaks timing that can recover it. No patched 0.9 release exists.

  The only path is `pgp` (rPGP) -> rsa, used by `cnm vetting bootstrap-pgp`
  to read an OpenPGP web of trust. That command only *verifies* RSA
  signatures — certifications and clearsigned link statements — with
  public keys from a keyring file. It never loads, generates or uses an RSA
  private key, so there is no secret for the side channel to leak. The
  workspace's own RSA need (KMS CMS unwrap) stays on aws-lc-rs.

  Drop when rPGP moves to an rsa release with the constant-time rewrite
  (0.10), or if `cnm` stops reading PGP keyrings.
  """ },

  { id = "RUSTSEC-2021-0127", reason = """
  serde_cbor 0.11.x is unmaintained. Used only by
  aws-nitro-enclaves-nsm-api for parsing Nitro attestation
  documents (COSE_Sign1 envelope). The attestation parser is
  read-only against quotes signed by the AWS Nitro PKI; the
  attack surface is "AWS infrastructure produces a malicious
  CBOR quote", which is well outside our threat model.

  Drop when aws-nitro-enclaves-nsm-api migrates to ciborium (or
  a maintained CBOR library).
  """ },


  { id = "RUSTSEC-2024-0436", reason = """
  paste 1.0.x is unmaintained. Build-time only: a proc-macro for token
  pasting pulled by uniffi_core / uniffi_bindgen (again via
  vta-mobile-core's UniFFI scaffolding). No runtime code; "unmaintained"
  is the only flagged risk.

  Drop when uniffi (0.28.x) removes its `paste` dependency.
  """ },

  { id = "RUSTSEC-2026-0173", reason = """
  proc-macro-error2 2.0.1 is unmaintained — the author has said so and
  recommends migrating away. Build-time only, and twice removed from
  anything we ship: it is a proc-macro, so it runs in the compiler and
  links into no artifact, and its only path into this workspace is
  vtc-client's optional, off-by-default `mls` feature —
  openmls_rust_crypto -> hpke-rs -> libcrux-sha3 -> hax-lib ->
  hax-lib-macros. A default build of every crate here does not resolve
  it at all.

  There is no version of this we can pick differently. OpenMLS 0.9 has
  one production crypto provider and this is what it depends on; the
  alternative is not a cleaner MLS but a hand-rolled group-key scheme,
  which the data-rooms design note explicitly declines.

  Drop when hax-lib moves off proc-macro-error2, or when OpenMLS's
  provider stack stops reaching libcrux.
  """ },

]

# License policy. Allow-list is derived from the actual licenses present
# in the dep graph as of 0.5.0 — every entry below appears on at least
# one transitive crate. All are OSI-approved permissive or weak-copyleft
# licenses compatible with our Apache-2.0 distribution.
#
# cargo-deny resolves OR-licensed crates against this allow list, so
# crates licensed under e.g. `Apache-2.0 OR GPL-2.0-only` or
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later` automatically resolve to a
# permissive branch we accept — no need to allow the copyleft alternatives.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  # MIT No Attribution — MIT minus the copyright-notice preservation
  # clause. OSI-approved, more permissive than MIT itself. Pulled in
  # transitively via regorus → jsonschema → referencing → fluent-uri
  # → borrow-or-share. Consistent with the "0BSD" entry below, which
  # is the functionally-equivalent BSD variant we already accept.
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
]
