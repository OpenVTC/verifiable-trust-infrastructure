# cargo-fuzz harness for the Verifiable Trust Infrastructure workspace.
#
# This is a **nested workspace** (note the empty `[workspace]` below): it is not
# a member of the root workspace, so `cargo build`/`test` at the repo root never
# pull in `libfuzzer-sys` or the nightly-only fuzz instrumentation. Drive it
# explicitly from this directory with `cargo +nightly fuzz run <target>`.
#
# Seed corpora live under `seeds/` (regenerate via the generators documented in
# `seeds/README.md`); README.md maps each target to its seed directory. CI
# builds every target (ci.yml, `Fuzz targets build`) and runs each one briefly
# every night (fuzz.yml).
[package]
name = "vti-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
time = "0.3"
chrono = "0.4"
serde_json = "1"
# The parse + verify entry points under test (issue #449). `attest-verify`
# pulls in the local COSE/CBOR decoder + cert-chain verifier; `sealed-transfer`
# the armor decoder and bundle opener; `provision-integration` the bootstrap
# VP verifier.
vta-sdk = { path = "../vta-sdk", features = ["attest-verify", "sealed-transfer", "provision-integration"] }
# The credential-exchange parsers (SD-JWT-VC presentation, OID4VP `vp_token`,
# OID4VCI key-binding proof) are vtc-service library functions and exist
# nowhere else. Its default features less `admin-ui` (no npm build) and
# `keyring`: vtc-service does not build with no features at all today
# (`url`, `website` and the TSP sealing are used outside their gates).
vtc-service = { path = "../vtc-service", default-features = false, features = ["setup", "website", "tsp"] }

[[bin]]
name = "fuzz_nitro_quote"
path = "fuzz_targets/fuzz_nitro_quote.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_nitro_verify"
path = "fuzz_targets/fuzz_nitro_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sealed_transfer_armor"
path = "fuzz_targets/fuzz_sealed_transfer_armor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_bootstrap_request"
path = "fuzz_targets/fuzz_bootstrap_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sd_jwt_presentation"
path = "fuzz_targets/fuzz_sd_jwt_presentation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_vp_token"
path = "fuzz_targets/fuzz_vp_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_oid4vci_proof"
path = "fuzz_targets/fuzz_oid4vci_proof.rs"
test = false
doc = false
bench = false

# Nested workspace: keep this crate out of the root workspace graph.
[workspace]
