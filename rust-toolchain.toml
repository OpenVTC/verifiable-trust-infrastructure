# The compiler every CI job and every Docker image builds with (#2658).
#
# Before this file every job ran `rustup toolchain install stable` under
# `-D warnings`, so a new stable release's lints could turn main red with no
# code change, and CI built with a different compiler from the images it ships
# (`Dockerfile` and `Dockerfile.nitro` build `FROM rust:1.95.0-bookworm`).
#
# Kept equal to the workspace `rust-version` (Cargo.toml) and to the Rust image
# in both Dockerfiles; `scripts/check-toolchain-pins.sh` fails when this is
# below `rust-version` and warns when a Dockerfile drifts from it. Dependabot
# proposes the bump (`.github/dependabot.yml`); move the Dockerfiles' `FROM
# rust:…` in the same PR. The MSRV job builds with `rust-version` regardless of
# this file, and the fuzz harness builds with nightly.
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
