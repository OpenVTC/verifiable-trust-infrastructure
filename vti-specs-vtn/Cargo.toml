[package]
name = "vti-specs-vtn"
description = "VTI's generated Trust Task wire types: the vtn/* family, at the versions trust-tasks.lock pins"
readme = "README.md"
version = "0.2.3"
edition.workspace = true
# Published, because `vta-sdk` is and re-exports these types through
# `vti-specs` (`vta_sdk::specs`): a published crate's whole closure must be.
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# build.rs reads the lock and the vendored bundles, so the package carries them.
include = [
  "/src/**",
  "/build.rs",
  "/README.md",
  "/trust-tasks.toml",
  "/trust-tasks.lock",
  "/trust-tasks/**",
]

[dependencies]
# The runtime only (no prebuilt specification modules): the generated code
# reaches serde, serde_json, regress and chrono through it.
trust-tasks-rs = { workspace = true }

[build-dependencies]
trust-tasks-build = { workspace = true }

[lints]
workspace = true

# cargo-machete reads `src/` only. Both are used where it does not look:
# `trust-tasks-build` by `build.rs`, and `trust-tasks-rs` by the code it
# generates into `OUT_DIR`.
[package.metadata.cargo-machete]
ignored = ["trust-tasks-build", "trust-tasks-rs"]
