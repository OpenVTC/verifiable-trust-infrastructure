[package]
name = "vta-config"
description = "VTA configuration types — the `AppConfig` TOML shape and its sub-configs, composing the vti-common and vti-secrets config types"
readme = "README.md"
version = "0.3.3"
edition.workspace = true
# Internal to this workspace — consumed through path dependencies only, never
# from crates.io. It was published by inheritance from `[workspace.package]`
# rather than by decision; the audit in #938 found no external consumer. See
# RELEASING.md ("What gets published").
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# TEE deployment config (`TeeConfig`, `TeeKmsConfig`, `TeeMode`, and the
# `AppConfig.tee` field). Off by default; the enclave binary enables it.
tee = []

[dependencies]
vti-common = { path = "../vti-common", version = "0.11" }
vti-secrets = { path = "../vti-secrets", version = "0.1" }
# Types only: the declarative approvals rule shape, so a config seed and the
# runtime row are the same struct rather than two that must be kept in step.
vta-sdk = { path = "../vta-sdk", version = "0.22", default-features = false }
serde = { workspace = true }
toml = { workspace = true }
serde_ignored = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
