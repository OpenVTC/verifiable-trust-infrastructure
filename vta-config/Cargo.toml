[package]
name = "vta-config"
description = "VTA configuration types — the `AppConfig` TOML shape and its sub-configs, composing the vti-common and vti-secrets config types"
readme = "README.md"
version = "0.3.3"
edition.workspace = true
# Published, because `vta-service` is — and a crate cannot go to crates.io
# without its whole dependency closure there too. Not published for its own
# sake: nothing outside this workspace is expected to depend on it directly.
#
# #938 set `publish = false` here on the finding that no external consumer
# existed. That was wrong by one: `openvtc-core` dev-depends on `vta-service`
# for `test_support::MockVta`, an in-process VTA the OpenVTC end-to-end tests
# run against. See `vta-service/Cargo.toml` for what unpublishing it actually
# broke. See RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# TEE deployment config (`TeeConfig`, `TeeKmsConfig`, `TeeMode`, and the
# `AppConfig.tee` field). Off by default; the enclave binary enables it.
tee = []

[dependencies]
vti-common = { path = "../vti-common", version = "0.11" }
vti-secrets = { path = "../vti-secrets", version = "0.1" }
# Types only: the declarative approvals rule shape, so a config seed and the
# runtime row are the same struct rather than two that must be kept in step.
vta-sdk = { path = "../vta-sdk", version = "0.23", default-features = false }
serde = { workspace = true }
toml = { workspace = true }
serde_ignored = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
