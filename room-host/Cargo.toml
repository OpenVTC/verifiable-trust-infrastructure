[package]
name = "room-host"
description = "Stores data-room records for rooms it does not govern — a delivery service, not a community"
version = "0.1.0"
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "room-host"
path = "src/main.rs"

[dependencies]
# Storage, wire types and authorization. The whole of what hosting a room needs —
# no member lifecycle, no policy engine, no credential issuance, no admin UI.
vti-rooms = { path = "../vti-rooms", version = "0.2" }
# The store and AppError. Nothing else internal.
vti-common = { path = "../vti-common", version = "0.18" }
vti-rooms-dtg = { path = "../vti-rooms-dtg" }
# The room client, for pulling from a write-primary. Host-neutral despite the
# name: a mirror reads its primary exactly as any member would, because that is
# the only way to read a room.
vtc-client = { path = "../vtc-client", version = "0.6" }

axum = { workspace = true }
# CORS only, and only when an operator asks for it — see `router_with_origins`.
tower-http = { workspace = true, features = ["cors"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = "1"
affinidi-did-resolver-cache-sdk = { workspace = true }

# A room host and a VTC serve the same protocol, so they must speak the same
# wire form: requests and responses are Trust Task documents, not bare JSON.
trust-tasks-rs = { workspace = true }
trust-tasks-https = { workspace = true }
uuid = { workspace = true }

# ── Being reachable at a mediator. Off by default — see `src/didcomm.rs`. ──
#
# A host that is not told to be reachable opens no socket and needs no identity,
# which is this crate's posture everywhere else too (network DID resolution off,
# browser origins off). Opening a standing outbound connection to a third party
# is a larger decision than either, so it is one an operator makes.
affinidi-tdk = { workspace = true, optional = true }
# `affinidi-messaging-sdk/tsp` is what compiles the real TSP unpack arm; without
# it the transport drops every TSP frame with a log line and nothing else. The
# facade forwards it on `main` since affinidi-tdk-rs#785 but in no published
# release yet, so this asks for it directly — and would anyway, because it needs
# `DidCommTransport` and `affinidi-messaging-core`'s shapes.
affinidi-messaging-sdk = { version = "0.24", optional = true, default-features = false, features = ["tsp"] }
affinidi-messaging-core = { workspace = true, optional = true }
# **The same secret storage every other service in this workspace uses.** The
# host's identity is a private key; it belongs behind the same `[secrets]`
# config and the same backends the VTA and VTC take, not in a file this crate
# invented. See `didcomm::HostIdentity`.
vti-secrets = { path = "../vti-secrets", version = "0.3", optional = true }
# The session store behind `onboarding` — which backend is an operator's choice,
# exactly as `[secrets]` is.
vta-sdk = { path = "../vta-sdk", version = "0.36", optional = true }
# Reading the `[secrets]` table out of a config file.
toml = { workspace = true, optional = true }
affinidi-secrets-resolver = { workspace = true, optional = true }
# `ENVELOPE_TYPE`, from the crate that defines the binding rather than a fourth
# hand-written copy of the URI.
trust-tasks-didcomm = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }


[features]
default = []
keyring = ["vti-secrets/keyring"]
config-secret = ["vti-secrets/config-seed"]
aws-secrets = ["vti-secrets/aws-secrets"]
gcp-secrets = ["vti-secrets/gcp-secrets"]
azure-secrets = ["vti-secrets/azure-secrets"]
vault-secrets = ["vti-secrets/vault-secrets"]
k8s-secrets = ["vti-secrets/k8s-secrets"]
## Enrol with a VTA: ephemeral `did:key` → operator grant → auto-rotate, the flow
## the mediator, PNM and did-hosting already use. Separate from `didcomm` because
## a host can be reachable without being governed by any VTA.
onboarding = ["dep:vti-secrets", "dep:vta-sdk", "vti-secrets/onboarding"]
## Session storage for the enrolled identity. One is required by `onboarding`, and
## which one is an operator's decision — the same shape as `[secrets]`.
config-session = ["vta-sdk/config-session"]
session-keyring = ["vta-sdk/keyring"]
## Serve Trust Tasks over DIDComm and TSP at a mediator, as well as over HTTP.
##
## Secret backends are opt-in on top, exactly as they are for the VTA and VTC —
## a host with none configured keeps its identity in a plaintext file under
## `--data-dir`, which is right for a laptop and not for anything else.
didcomm = [
    "dep:vti-secrets",
    "dep:toml",
    "dep:affinidi-tdk",
    "dep:affinidi-messaging-sdk",
    "dep:affinidi-messaging-core",
    "dep:affinidi-secrets-resolver",
    "dep:trust-tasks-didcomm",
    "dep:futures-util",

]

[dev-dependencies]
# A mediator in-process, so the carrier round trip is tested against a real one
# rather than a simulator. Everything `tests/carrier.rs` covers is packing,
# routing, threading and acking — a simulator would be a second opinion about
# exactly the parts that were wrong.
affinidi-messaging-test-mediator = { version = "0.7", features = ["tsp"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
vti-rooms-dtg = { path = "../vti-rooms-dtg", features = ["test-support"] }

# The `data_room` example drives this host with the real client, so it needs the
# client's MLS layer and a throwaway signer. None of this reaches the binary.
vtc-client = { path = "../vtc-client", features = ["mls"] }
vta-sdk = { path = "../vta-sdk" }
openmls_rust_crypto = "0.6"
ed25519-dalek = { workspace = true }
multibase = { workspace = true }
base64 = { workspace = true }
getrandom = "0.4"
reqwest = { workspace = true }
uuid = { workspace = true }
