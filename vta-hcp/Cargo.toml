[package]
name = "vta-hcp"
description = "The VTA's Human Context Protocol provider: grants, tokens, holds, entries and notices, behind vta-service's hcp feature"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
# Published, because `vta-service` is and depends on it (optionally, behind its
# `hcp` feature) — and a crate cannot go to crates.io without its whole
# dependency closure there too, optional dependencies included. Not published
# for its own sake: nothing outside this workspace is expected to depend on it
# directly.
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Must never depend on `vta-service`: it is a subsystem crate below the spine
# (docs/05-design-notes/vta-service-decomposition.md), and `vta-service`
# depends on it.
[dependencies]

[lints]
workspace = true
