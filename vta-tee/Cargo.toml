[package]
name = "vta-tee"
description = "VTA TEE bootstrap — Nitro/SEV-SNP attestation providers, KMS attest/decrypt + storage-key derivation, the anchor MAC, and first-boot DID autogen"
readme = "README.md"
version = "0.1.5"
edition.workspace = true
# Internal to this workspace — consumed through path dependencies only, never
# from crates.io. It was published by inheritance from `[workspace.package]`
# rather than by decision; the audit in #938 found no external consumer. See
# RELEASING.md ("What gets published").
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Fleet (`BAKE_CONFIG=false`) builds only: compile in the vsock tenant-config
# overlay fetch/apply path (`tenant_overlay` module). Off by default so a
# self-host/baked build's binary contains no vsock config-fetch code. See
# docs/05-design-notes/tenant-config-allowlist.md §3.1/§3.8.
tenant-overlay = ["dep:tokio-vsock"]

[dependencies]
vti-common = { path = "../vti-common", version = "0.11", features = ["encryption", "openapi"] }
vta-keyspaces = { path = "../vta-keyspaces", version = "0.1" }
vta-config = { path = "../vta-config", version = "0.3", features = ["tee"] }
vta-keys = { path = "../vta-keys", version = "0.2" }
vta-support = { path = "../vta-support", version = "0.2" }
aes-gcm = { workspace = true }
utoipa = { workspace = true }
rand = { workspace = true }
bip39 = "2"
hmac = "0.13"
aws-sdk-kms = "1"
aws-sdk-dynamodb = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-lc-rs = "1"
aes = "0.9"
cbc = "0.2"
libc = { workspace = true }
didwebvh-rs = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
# Only pulled in by the `tenant-overlay` feature (fleet builds) for the vsock
# config-envelope fetch.
tokio-vsock = { workspace = true, optional = true }
