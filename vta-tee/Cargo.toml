[package]
name = "vta-tee"
description = "VTA TEE bootstrap — Nitro/SEV-SNP attestation providers, KMS attest/decrypt + storage-key derivation, the anchor MAC, and first-boot DID autogen"
readme = "README.md"
version = "0.1.1"
edition.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vti-common = { path = "../vti-common", version = "0.11", features = ["encryption", "openapi"] }
vta-keyspaces = { path = "../vta-keyspaces", version = "0.1" }
vta-config = { path = "../vta-config", version = "0.1", features = ["tee"] }
vta-keys = { path = "../vta-keys", version = "0.1" }
vta-support = { path = "../vta-support", version = "0.1" }
aes-gcm = { workspace = true }
utoipa = { workspace = true }
rand = { workspace = true }
bip39 = "2"
hmac = "0.13"
aws-sdk-kms = "1"
aws-sdk-dynamodb = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-lc-rs = "1"
aes = "0.9"
cbc = "0.2"
libc = { workspace = true }
didwebvh-rs = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
