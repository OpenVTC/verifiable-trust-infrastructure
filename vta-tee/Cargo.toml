[package]
name = "vta-tee"
description = "VTA TEE bootstrap — Nitro/SEV-SNP attestation providers, KMS attest/decrypt + storage-key derivation, the anchor MAC, and first-boot DID autogen"
readme = "README.md"
version = "0.41.1"
edition.workspace = true
# Published, because `vta-service` is — and a crate cannot go to crates.io
# without its whole dependency closure there too. Not published for its own
# sake: nothing outside this workspace is expected to depend on it directly.
#
# #938 set `publish = false` here on the finding that no external consumer
# existed. That was wrong by one: `openvtc-core` dev-depends on `vta-service`
# for `test_support::MockVta`, an in-process VTA the OpenVTC end-to-end tests
# run against. See `vta-service/Cargo.toml` for what unpublishing it actually
# broke. See RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Fleet (`BAKE_CONFIG=false`) builds only: compile in the vsock tenant-config
# overlay fetch/apply path (`tenant_overlay` module). Off by default so a
# self-host/baked build's binary contains no vsock config-fetch code. See
# docs/05-design-notes/tenant-config-allowlist.md §3.1/§3.8.
tenant-overlay = ["dep:tokio-vsock"]

[dependencies]
vti-common = { path = "../vti-common", version = "0.65", features = ["encryption", "openapi"] }
vta-keyspaces = { path = "../vta-keyspaces", version = "0.38" }
vta-config = { path = "../vta-config", version = "0.41", features = ["tee"] }
vta-keys = { path = "../vta-keys", version = "0.42" }
vta-support = { path = "../vta-support", version = "0.39" }
aes-gcm = { workspace = true }
utoipa = { workspace = true }
rand = { workspace = true }
bip39 = { workspace = true }
hmac = { workspace = true }
# `default-features = false` drops the SDKs' `rustls` feature, which is not
# "use rustls" but `aws-smithy-runtime/tls-rustls` -> the smithy client's
# `legacy-rustls-ring` -> **rustls 0.21.8** -> rustls-webpki 0.101.7, the
# stale copy behind three Dependabot alerts. The modern stack is already in
# the tree (`rustls-aws-lc`, rustls 0.23) via `default-https-client`, so the
# legacy pull was redundant as well as vulnerable. Nothing in this workspace
# names rustls-webpki, so a direct bump cannot move it — the feature edge is
# the only lever. Re-adding a default-featured `aws-sdk-*` dependency
# reintroduces all three alerts.
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { workspace = true, features = ["credentials-process", "sso"] }
# Not called from this crate — a resolver bound, explained in the workspace
# manifest. Unconditional because `aws-config` above is: without it a plain
# `cargo build --workspace` resolves `aws-smithy-types` 1.7.0 and fails to
# compile `aws-smithy-json` 0.63.0.
aws-smithy-types.workspace = true
aws-lc-rs = { workspace = true }
aes = "0.9"
cbc = "0.2"
libc = { workspace = true }
didwebvh-rs = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
# Only pulled in by the `tenant-overlay` feature (fleet builds) for the vsock
# config-envelope fetch.
tokio-vsock = { workspace = true, optional = true }

[dev-dependencies]
# `authorized_reinit_leaves_no_state_sealed_against_the_old_seed` opens a real
# fjall store to assert what the reinit clear leaves behind.
tempfile = { workspace = true }
# `test-util` for `#[tokio::test(start_paused = true)]`: the genesis/update
# `version_time` tests exercise the same-second wait without spending it for
# real on every run.
tokio = { workspace = true, features = ["test-util"] }

# The workspace lint table with `unsafe_code` at `deny`, not `forbid` (#2658):
# this crate needs `unsafe` for the `/dev/nsm` and `/dev/sev-guest` ioctls. Each such
# statement carries `#[allow(unsafe_code)]` beside its SAFETY comment.
# `scripts/check-workspace-lints.py` holds this table to `[workspace.lints]`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unsafe_code = "deny"

[lints.clippy]
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

# Not called from this crate: `aws-smithy-types` is a resolver bound (see its
# entry above and the workspace manifest).
[package.metadata.cargo-machete]
ignored = ["aws-smithy-types"]
