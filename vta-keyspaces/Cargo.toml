[package]
name = "vta-keyspaces"
description = "VTA keyspace-name registry — the shared storage vocabulary for the VTA subsystem crates"
readme = "README.md"
version = "0.1.1"
edition.workspace = true
# Internal to this workspace — consumed through path dependencies only, never
# from crates.io. It was published by inheritance from `[workspace.package]`
# rather than by decision; the audit in #938 found no external consumer. See
# RELEASING.md ("What gets published").
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Gates the `webvh` field on the shared `Keyspaces` handle bundle, mirroring
# the consumer crates' `webvh` feature.
webvh = []

[dependencies]
# For `KeyspaceHandle` in the shared `Keyspaces` handle bundle.
vti-common = { path = "../vti-common", version = "0.11" }
