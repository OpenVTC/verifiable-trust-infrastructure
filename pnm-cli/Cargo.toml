[package]
name = "pnm-cli"
description = "CLI Tool for managing a personal Verifiable Trust Agent"
version = "0.60.0"
edition.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true

[[bin]]
name = "pnm"
path = "src/main.rs"

[features]
default = ["keyring", "tsp"]
keyring = ["vta-sdk/keyring"]
config-session = ["vta-sdk/config-session"]
azure-secrets = ["vta-sdk/azure-secrets"]
# Trust Spanning Protocol probe in `pnm health`. **On by default** — TSP is the
# preferred transport (TSP > DIDComm > REST), so operators get the round-trip
# probe out of the box. Enables the SDK's `TspPingSession`. Build with
# `--no-default-features` (re-adding `keyring`) to drop the TSP deps; without
# it `pnm health` still recognises an advertised `TSPTransport` service but
# notes the probe isn't compiled in.
tsp = ["vta-sdk/tsp"]

[dependencies]
vta-sdk = { path = "../vta-sdk", version = "0.88", features = ["session", "sealed-transfer", "attest-verify", "provision-integration", "crypto-provider", "acl-setup"] }
affinidi-crypto = { workspace = true }
reqwest = { workspace = true }
# `agent-names` powers the global `--resolve-agent-names` flag; without it
# the flag parses but can never resolve anything.
vta-cli-common = { path = "../vta-cli-common", version = "0.61", features = [
  "agent-names",
] }
affinidi-did-resolver-cache-sdk = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
dialoguer = { workspace = true }
# `pnm messaging console`: the mediator console and its engine.
# 0.43 is the release on `affinidi-messaging-sdk` 0.37 / `trust-tasks-rs` 0.32
# (affinidi-messaging-mediator #18), moving in lockstep with this workspace.
# 0.47 is on `affinidi-messaging-sdk` 0.43, so its types are the 0.2 ones.
# 0.48 is on `affinidi-messaging-sdk` 0.44 / `trust-tasks-rs` 0.36.
affinidi-messaging-mediator-admin = "0.50"
affinidi-messaging-mediator-tui = "0.50"
affinidi-secrets-resolver = { workspace = true }
async-trait = { workspace = true }
ratatui = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
multibase = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

# The workspace lint table with `unsafe_code` at `deny`, not `forbid` (#2658):
# this crate needs `unsafe` for `std::env::set_var` at startup. Each such
# statement carries `#[allow(unsafe_code)]` beside its SAFETY comment.
# `scripts/check-workspace-lints.py` holds this table to `[workspace.lints]`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unsafe_code = "deny"

[lints.clippy]
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
