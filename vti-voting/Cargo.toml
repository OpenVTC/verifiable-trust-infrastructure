[package]
name = "vti-voting"
description = "Community voting on the Predicate Credential System: unlinkable voting tickets, casts bound to their ballot, and the ballot box's one-ballot-per-ticket check"
version = "0.2.0"
edition.workspace = true
readme = "README.md"
# Published, because `vta-service` and `vtc-service` are: the VTA runs the
# voter role and the VTC the registrar, and a crate cannot go to crates.io
# without its whole dependency closure there too.
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The scheme instance (BLS12-381, Σ-PS, Tag_DDH) is the one hidden vetting
# runs; its aliases come from there so the two can never drift apart. Voting
# uses its own deployment label and keys (`scheme::deployment_label`).
vti-vetting-pcs = { path = "../vti-vetting-pcs", version = "0.6" }
predicate-credential-system = { version = "0.1", features = ["serde"] }
ark-serialize = { version = "0.6.0", default-features = false, features = ["std"] }
# MUST stay 0.8: the PCS algorithms take `ark_std::rand`'s (0.8) traits.
rand = { version = "0.8", features = ["std", "std_rng", "getrandom"] }
# Pairs with rand 0.8: the registrar's keys derive from a secret over a
# specified stream (`registrar::Registrar::derive`).
rand_chacha = "0.3"
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
chrono.workspace = true
multibase.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
# The generated `voting/*` wire types (0.32.3+).
trust-tasks-rs.workspace = true
# The trustees' group for the sealed and tallied-encrypted levels (`trustees`): Ristretto, the
# same curve25519-dalek the workspace's Ed25519 keys already run on. Scalars are derived from
# bytes, never from its `rand_core`, so the PCS stack's rand 0.8 stays independent of it.
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
# The sealed level's data encapsulation.
chacha20poly1305 = "0.10"

[dev-dependencies]
rand = { version = "0.8", features = ["std", "std_rng"] }
