  "didcomm-test",
  "pnm-cli",
  "room-host",
  "tests/e2e",
  "vta-cli-common",
  "vta-config",
  "vta-keyspaces",
  "vta-audit",
  "vta-backup",
  "vta-keys",
  "vta-policy",
  "vta-mcp",
  "vta-mobile-core",
  "vta-sdk",
  "vta-support",
  "vta-tee",
  "vta-sweepers",
  "vta-vault",
  "vta-webvh",
  "vta-persona",
  "vta-service",
  "vta-enclave",
  "vtc-client",
  "vtc-service",
