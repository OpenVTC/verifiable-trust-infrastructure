
[workspace]
members = [
  "cnm-cli",
  "didcomm-test",
  "pnm-cli",
  "tests/e2e",
  "vta-cli-common",
  "vta-config",
  "vta-keyspaces",
  "vta-audit",
  "vta-backup",
  "vta-keys",
  "vta-policy",
  "vta-mcp",
  "vta-mobile-core",
  "vta-sdk",
  "vta-support",
  "vta-tee",
  "vta-sweepers",
  "vta-vault",
  "vta-webvh",
  "vta-service",
  "vta-enclave",
  "vtc-client",
  "vtc-service",
  "vti-common",
  "vti-secrets",
  "vti-webauthn",
]
# `vta-mobile-core` is a UniFFI client crate that cross-compiles to Android/iOS.
# Keep it out of `default-members` so a bare `cargo build`/`test` for the server
# does not pull `uniffi` (or the mobile crate) into the build graph. CI that runs
# `--workspace` still builds and lints it; the mobile-artifacts job cross-compiles it.
default-members = [
  "cnm-cli",
  "didcomm-test",
  "pnm-cli",
  "tests/e2e",
  "vta-cli-common",
  "vta-config",
  "vta-keyspaces",
  "vta-audit",
  "vta-backup",
  "vta-keys",
  "vta-policy",
  "vta-mcp",
  "vta-sdk",
  "vta-support",
  "vta-tee",
  "vta-sweepers",
  "vta-service",
  "vta-vault",
  "vta-webvh",
  "vta-enclave",
  "vtc-client",
  "vtc-service",
  "vti-common",
  "vti-secrets",
  "vti-webauthn",
]
exclude = ["deploy/nitro/enclave-proxy"]
resolver = "3"

[workspace.package]
description = "Verifiable Trust Infrastructure (VTI) — VTA, VTC, and supporting crates"
edition = "2024"
publish = true
authors = ["Glenn Gore <glenn@affinidi.com>"]
rust-version = "1.95.0"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/verifiable-trust-infrastructure"

[workspace.dependencies]

# Foreign-language bindings for the mobile engine crate (`vta-mobile-core`).
uniffi = "0.32"

# Affinidi Trust Development Kit.
# Pinned to a minimum patch (not bare `0.8`) because 0.8.5 is the first release
# carrying the enforced-authcrypt fix (affinidi-tdk-rs #671): it depends on
# `affinidi-messaging-sdk` 0.19 + `affinidi-messaging-didcomm` 0.15.8, where
# `unpack` rejects plaintext / anoncrypt / forged-`from` envelopes by default.
# `0.8` would let a fresh resolve on a clean checkout land on a pre-fix 0.8.x,
# silently moving sender authentication back out of the library. Do not relax it.
affinidi-tdk = "0.10"
# Raw crypto primitives (ed25519↔x25519 conversion, did:key helpers). Pulled
# directly so sealed-transfer can use `affinidi_crypto::did_key::*` without
# going through the higher-level Secret wrapper in secrets-resolver.
affinidi-crypto = "0.2"
# W3C VC Data Model 2.0 + Data Integrity proofs. Used by the
# provision-integration flow (VP-framed bootstrap request, VC-issued
# admin authorization). See CLAUDE.md "Authorization claims" principle.
affinidi-vc = "0.2"
affinidi-data-integrity = "0.7"
affinidi-status-list = "0.1.3"

# Credential formats for the credential-centric VTI architecture
# (docs/05-design-notes/vti-credential-architecture.md). All published on
# crates.io and validated upstream in the TDK:
#   - affinidi-sd-jwt-vc  — SD-JWT-VC issue/verify (IETF draft-ietf-oauth-sd-jwt-vc).
#     Near-term credential path; runs on existing Ed25519/JOSE, no new curve.
#   - affinidi-bbs        — BBS+ signatures over bls12_381_plus (IETF
#     draft-irtf-cfrg-bbs-signatures). The unlinkable, selective-disclosure
#     track. Gated on an independent security audit before signing real
#     credentials (tasks §0.5).
#   - affinidi-openid4vp  — OID4VP presentation exchange (DCQL lands upstream
#     in a later task; this is the published base).
#   - affinidi-mdoc       — ISO/IEC 18013-5 mdoc, the second credential format
#     eIDAS 2.0 mandates alongside SD-JWT VC. 0.2.6 added the `IssuerSigned`
#     CBOR wire codec without which a vault storing opaque bodies could never
#     re-read what it held. `default-features = false` + `es256`: ISO 18013-5
#     and the EUDI profiles mandate ES256, which the VTA already has via
#     `KeyType::P256`, so no new curve enters the graph.
# The `bbs-2023` Data Integrity cryptosuite lives behind the
# `affinidi-data-integrity` `bbs-2023` feature, enabled per-consumer where the
# BBS proof path is wired. If you path-override these to the local TDK for an
# unreleased change (e.g. DCQL), override the whole interdependent set together
# to avoid a duplicate-version split.
affinidi-sd-jwt-vc = "0.2"
affinidi-sd-jwt = "0.1.2"
affinidi-bbs = "0.3"
affinidi-openid4vp = "0.1.2"
affinidi-mdoc = { version = "0.2.7", default-features = false, features = ["es256"] }
# Both already enter the graph through `affinidi-mdoc`; declared here because
# the mdoc receive path names their types directly (`coset` for the COSE_Sign1
# `alg` header, `time` for the `validityInfo` window) and depending on a
# transitive is how a version bump elsewhere breaks an unrelated crate.
coset = "0.3"
time = "0.3"
# X.509 for the mdoc IACA trust path. `verify-aws` rather than the default
# `verify` feature: that one pulls `ring`, which currently only reaches this
# workspace through a dev-dependency, while `aws-lc-rs` is already a real
# dependency (it replaced `rsa` for KMS CMS unwrap in 0.5). Same crypto, no new
# production tree.
x509-parser = { version = "0.18", features = ["verify-aws"] }
affinidi-openid4vci = "0.2"
affinidi-secrets-resolver = "0.5"
# Reliable messaging delivery layer (durable outbox + drain + §5a confirmation)
# over the MessageTransport contract — the D1 delivery layer the VTI cut-over
# (D2) wires in. `VtiOutboxStore` (vti-common) backs its OutboxStore with fjall.
affinidi-messaging-delivery = "0.1"
# Transport-agnostic messaging contract (`MessageTransport`, `Inbound`,
# `ReceivedMessage`, `MessagingError`) the delivery layer builds on. Referenced
# directly by services that demux `MessagingService::subscribe()` inbound.
affinidi-messaging-core = "0.1"
# Async `Stream` combinators (`StreamExt`, `BoxStream`) for draining the
# delivery layer's `subscribe()` inbound. Matches the `= "0.3"` pin the
# services already use directly.
futures-util = "0.3"

# Decentralized Trust Graph Credentials
dtg-credentials = "0.4"

# JSON Schema validation (issue-time credentialSchema checks)
jsonschema = "0.46"

# Async runtime
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "signal",
  "time",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
# Surfaces unknown/typo'd keys during deserialization without rejecting them
# (config.rs unknown-key warning pass).
serde_ignored = "0.1"

# Error handling
thiserror = "2"

# Embedded key-value store
fjall = "3"

# Serialization (JSON)
serde_json = "1"

# Key derivation (BIP32)

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.10"

# DID Web with Verifiable History
didwebvh-rs = "0.6"

# URL parsing
url = "2"

# Cryptography
ed25519-dalek = "3"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
# Constant-time byte equality. Used wherever we compare a
# server-stored hash against a caller-supplied value (e.g.
# backup-bundle bearer tokens). Already used by vtc-service.
subtle = "2.6"
x25519-dalek = { version = "3", features = ["static_secrets"] }
multibase = "0.9"

# JWT
# Switched off `rust_crypto` (the all-algos bundle) because it pulls in
# the `rsa` crate which is exposed to RUSTSEC-2023-0071 (Marvin Attack
# timing sidechannel). We use jsonwebtoken only for EdDSA JWTs
# (`Algorithm::EdDSA` in vti-common/auth/jwt.rs).
#
# Use the `aws_lc_rs` backend instead — it provides a single
# `CryptoProvider` for every algorithm and is already in our dep tree
# via `aws-sdk-kms`, so we don't add a new transitive. The backend is
# the AWS-vetted libcrypto fork; same primitives, no `rsa` crate.
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }

# AWS-LC backend used directly by `vti-webauthn` for ECDSA P-256 WebAuthn
# assertion verification. Already in our dep tree via `jsonwebtoken`'s
# `aws_lc_rs` feature and via `aws-sdk-kms`; hoisting here so the
# crypto-pin discipline (CLAUDE.md "Versioning & publishing") applies
# uniformly. Pin minimum patch — CVE landings should not silently
# regress.
aws-lc-rs = "1.16"

# Trust-Tasks framework — wire-envelope for the trust-task migration
# initiative (docs/05-design-notes/trust-task-uri-registry.md). On
# crates.io; the `[patch.crates-io]` git pin that lived here through
# the pre-publish window is gone. 0.2 adds `v0_2` spec modules
# (camelCase wire enums + `/0.2` TYPE_URIs) alongside the retained
# `v0_1` modules — the VTA dual-accepts both during the migration.
# Bump in lockstep with affinidi-webvh-service when upstream publishes.
#
# Pinned to a minimum patch (not bare `0.11`) because 0.11.2 is the first
# release carrying the `vta/app-state/*` schemas. `schema_index::schema_for`
# is what `every_served_uri_has_a_published_spec_or_is_tracked_debt` consults,
# so a resolve that landed on 0.11.0 or 0.11.1 would fail that harness rather
# than fail quietly — but it would fail as "you are serving unspecced URIs",
# which reads as an implementation fault instead of a stale dependency. The
# pin makes the resolver say the true thing instead.
# `all-specs` is declared, not inherited. This workspace asked for
# `default-features = false` and got every spec family anyway, because
# `affinidi-messaging-sdk` -> `affinidi-tdk` happens to enable the default
# feature and cargo unions them. That is the entire schema index arriving by
# luck: if any crate in that chain ever set `default-features = false`,
# `schema_index::schema_for` would answer `None` for every URI, `validate_payload`
# would stop validating with one `debug!` line to say so, and `spec_policy_for`
# would stop enforcing SPEC §7.2 the same way. Both fail *open*.
trust-tasks-rs = { version = "0.17", default-features = false, features = [
  "validate",
  "all-specs",
] }
trust-tasks-capability-client = "0.17"
trust-tasks-https = { version = "0.17", default-features = false, features = ["server", "client", "jwt"] }
# The DIDComm binding. Carries `ENVELOPE_TYPE` — the one `type` every
# Trust-Task DIDComm message must use, with the `TrustTask<P>` as its body —
# and the `pack_trust_task`/`unpack_trust_task` pair that enforce it.
#
# Taken as a real dependency rather than copying the URI: four hand-written
# copies had accumulated across this workspace, and the consent push was
# hand-building its message with the *task* type instead of the envelope type.
# A conformant peer rejects that, silently, because "not an envelope" is
# indistinguishable from "not addressed to me". One constant, from the crate
# that defines it.
trust-tasks-didcomm = { version = "0.17", default-features = false }
trust-tasks-proof = { version = "0.17", default-features = false, features = ["affinidi"] }

# Axum extras (typed headers for Bearer auth)
axum-extra = { version = "0.12", features = ["typed-header"] }

# Base64 encoding
base64 = "0.23"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# tonic 0.12.x forces `ring` on tokio-rustls; explicit dep lets main() install aws-lc-rs as the default provider.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }

# Interactive prompts
dialoguer = "0.12"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Terminal UI
ratatui = "0.30"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Hoisted to keep version pins consistent across the 3+ crates that use them.

# Web framework — pinned at workspace level so vta-service and vtc-service
# (and vti-common's axum extractors) never drift onto different majors.
axum = "0.8"
tower-http = "0.7"
tokio-util = "0.7"

# OpenAPI 3.1 generation. `utoipa` derives schemas (ToSchema) + per-handler
# path metadata; `utoipa-axum` (`OpenApiRouter`) makes the router the single
# source of truth so the served `/openapi.json` can't drift from the routes.
# The SDK gates its `ToSchema` derives behind its own `openapi` feature so the
# published artifact stays slim; the services depend on utoipa unconditionally.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"

# Used by every CLI (operator config) and both services (config-from-toml).
toml = "1"
dirs = "6"

# Hex encode/decode — sealed-transfer producer keys, key fingerprints, etc.
hex = "0.4"

# Symmetric crypto helpers used by sealed-transfer + storage encryption.
aes-gcm = "0.11"
hkdf = "0.13"

# HMAC-SHA256 for vti-common's audit-log actor/target identifier
# hashing. The key is per-community and rotated on RTBF, so a plain
# SHA-256 over a DID would be reversible by enumeration — see spec
# §11.1.
hmac = "0.13"

# Vsock-store deps shared by vti-common's vsock keyspace and the enclave
# bootstrap; libc is also used by vta-service's vsock-bridge helpers.
tokio-vsock = "0.7"
libc = "0.2"

# Azure secret-store deps shared across SDK + both services.
azure_security_keyvault_secrets = "1.0"
azure_identity = "1.0"

# Kubernetes secret-store backend (feature `k8s-secrets`, off by default) for
# both services. The seed/key material is stored as a hex string inside a
# namespaced `Secret` resource. `Client::try_default()` auto-detects the
# in-cluster ServiceAccount or a local kubeconfig, so no auth knobs are needed.
# `default-features = false` + `rustls-tls` keeps OpenSSL out of the tree (the
# rest of the workspace is rustls). `k8s-openapi`'s `latest` feature floats the
# generated API version — fine here, the core/v1 `Secret` shape is long-stable.
# `kube` and `k8s-openapi` move together: `kube` depends on a specific
# `k8s-openapi` major, and two copies in the tree make *neither* resolve a
# version feature — k8s-openapi's build script then panics with "None of the
# v1_* features are enabled", naming the copy that has none rather than the
# mismatch that produced it. kube 3.1 is on k8s-openapi 0.27; kube 4.2 is on
# 0.28. Bumping one without the other is what makes that error appear.
kube = { version = "4.2", default-features = false, features = [
  "client",
  "rustls-tls",
] }
k8s-openapi = { version = "0.28", features = ["latest"] }

# Hoist DID-resolver-cache feature drift: every crate uses 0.8 but a few
# omit the `network` feature. The default here turns it on; dependents
# that want the offline-only cache can opt out via `default-features = false`.
affinidi-did-resolver-cache-sdk = { version = "0.8", features = ["network"] }

# Agent names — human-memorable `example.com/@alice` shortcuts that resolve to
# DIDs. Consumed by `vta_sdk::display_name` (feature `agent-names`) for the
# *reverse* direction only: reading the names a DID's document claims via
# `alsoKnownAs`, then round-tripping each claim to confirm it leads back to
# that same DID. Nothing in this workspace publishes an `alsoKnownAs` entry
# yet, so today this resolves nothing — it is wired so that minting names
# (a separate piece of work, in `affinidi-webvh-service`) lights up every
# operator surface without touching a display site.
agent-names = "0.1.3"
# The `Document` type `agent-names` and the resolver cache both speak. Only
# needed where we hand a resolved document to `extract_agent_names`.
affinidi-did-common = "0.4"

# WebAuthn / passkey infrastructure. Used by vti-common's `passkey` feature
# for shared enrolment + login ceremonies — both VTA (admin auth, later) and
# VTC (install + admin login) consume it. The version pin matches what
# `affinidi-webvh-service` ships against, since we adopt that crate's
# passkey module pattern.
webauthn-rs = { version = "0.5", features = [
  "danger-allow-state-serialisation",
] }

# Rego (OPA policy language) interpreter. In-process — no OPA sidecar.
# Used by `vtc-service`'s policy engine (Phase 2 M2.1). Defaults include
# `arc` so `regorus::Engine` is `Send + Sync` and `full-opa` for the
# stdlib builtins (regex, time, etc.) that real policies (`join.rego`,
# `removal.rego`) lean on. Trim later if compile times bite.
regorus = "0.11"

# OS keyring API (replaces legacy `keyring` v3 crate). keyring-core 1.0 split
# the API from the backend stores; each binary picks a platform-native store
# and registers it once at startup via `vta_sdk::keyring_init::install_default_store`.
keyring-core = "1"
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
windows-native-keyring-store = "1"
dbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["crypto-rust"] }

[profile.dev]
# macOS defaults this profile to `split-debuginfo = "unpacked"`, which leaves one
# DWARF-bearing .o file per codegen unit in target/debug/deps. Across this
# workspace's 903-crate graph that reached 746,803 loose object files and 372G,
# at which point cargo's own fingerprint/GC pass cost 9m26s on a NO-OP
# `cargo check` (12% CPU — all filesystem, no compilation). The same check in a
# clean target dir is 0.21s. Keep debuginfo cheap so it cannot rebuild to that.
debug = "line-tables-only"
split-debuginfo = "packed"

# Dependencies are not stepped through; their debug symbols were most of the bulk.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Workspace-wide lint policy. Each crate inherits via `lints.workspace = true`
# in its own Cargo.toml. Per-crate `#[allow(...)]` overrides are still possible
# but visible in review.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Style/escape-hatch fences. Crates that want the broader clippy::all
# default still get it via the `cargo clippy -- -D warnings` CI gate.
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

# There is deliberately no `[patch.crates-io]` here any more.
#
# One used to live at this spot, forcing the workspace copy of `vta-sdk` to be
# the only one in the graph. A transitive dev-dependency pulled our own crate
# back in from crates.io —
#
#   vtc-service [dev-dependencies]
#     -> affinidi-messaging-test-mediator
#       -> affinidi-messaging-mediator
#         -> vta-sdk   (registry, NOT the workspace path copy)
#
# — so Cargo.lock carried two `vta-sdk` nodes, and the registry one went stale
# the instant we published. `cargo publish --locked` verifies dependents against
# it, so a dependent got built against the PREVIOUS release's source, silently,
# while the workspace's own path-dep build stayed green. That is how pnm-cli
# 0.11.2 was verified against vta-sdk 0.19.11 minutes after 0.19.12 shipped, and
# sat unpublished for three releases.
#
# The patch deleted that second node rather than chasing it — but only while the
# workspace copy satisfied the mediator's requirement on `vta-sdk`. Under 0.x
# semver a minor bump does not, so the patch silently stopped applying and the
# node came back, at 0.20 (#797), 0.21 (#887) and 0.22 (#950). Each time the fix
# was an upstream release widening a requirement, which buys one version of
# headroom and leaves the cycle in place.
#
# affinidi/affinidi-tdk-rs#703 removed the last hop instead. `vta-sdk` is now
# optional in `affinidi-messaging-mediator` (0.18.13+) behind a default-on `vta`
# feature, and `affinidi-messaging-test-mediator` already depends on that crate
# with `default-features = false`, so the chain above no longer reaches
# `vta-sdk` at all. Nothing pulls a registry copy in, so there is nothing to
# patch out.
#
# `scripts/check-lockfile-self-pins.sh` stays. Its job is to notice a NEW
# self-pin — some other dev-dependency chain reaching one of our crates. If it
# ever reports one, the fix is the same choice we faced here: patch it (fast,
# and it will break again on the next minor bump) or cut the dependency edge
# upstream (slower, permanent).

