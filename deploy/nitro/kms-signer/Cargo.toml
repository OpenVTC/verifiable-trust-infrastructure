[package]
name = "kms-signer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sign VTA Nitro EIFs with a non-exportable AWS KMS key, and mint the PCR8 certificate that carries the KMS public key."

# Detached from the parent workspace on purpose: this is a build-host tool, not
# part of the VTA server build graph.
[workspace]

[[bin]]
name = "kms-signer"
path = "src/main.rs"

[dependencies]
aws-nitro-enclaves-image-format = "0.7"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-kms = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
x509-cert = { version = "0.2", features = ["builder", "pem"] }
spki = { version = "0.7", features = ["pem"] }
der = { version = "0.7", features = ["pem", "std"] }
const-oid = { version = "0.9", features = ["db"] }
