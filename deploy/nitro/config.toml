# =============================================================================
# VTA Configuration — AWS Nitro Enclave
# =============================================================================
#
# CONFIG BAKING IS A BUILD-TIME CHOICE (see Dockerfile.nitro "CONFIG MODES"):
#   - BAKE_CONFIG=true  (DEFAULT) — THIS file is baked into the Enclave Image
#     File (EIF) and committed to PCR0. Best for single-tenant / self-hosted
#     deploys: fully attested, and the binary has no vsock config-fetch code.
#   - BAKE_CONFIG=false — THIS file is NOT baked. Instead the image bakes
#     config.fleet-base.toml (fleet policy + placeholders), so one image / one
#     PCR0 serves every tenant. At runtime the parent serves a small typed
#     tenant OVERLAY ({ "version":1, "overlay":{…}, "integrity":null }) over
#     vsock:5800; the enclave parses it (deny_unknown_fields, an allowlist) and
#     applies it onto the baked base. Only the tenant-scoped fields (key_arn,
#     mediator_did, vta_did_template, public_url, vta_name) are overlay-settable;
#     mode, admin_did, and every allow_* flag stay baked. See
#     docs/05-design-notes/tenant-config-allowlist.md and render-tenant-overlay.sh.
#
# For BAKE_CONFIG=true this file is the canonical config, and a mounted/baked
# /etc/vta/config.toml is always used as-is (e.g. for LOCAL / DEV runs).
#
# QUICK START — You only need to set TWO values:
#   1. key_arn       — Your KMS key ARN (in [tee.kms])
#   2. mediator_did  — Your mediator's DID (in [messaging])
#
# Everything else has sensible defaults for TEE operation.
#
# SECRETS: The VTA generates its own seed and JWT key inside the TEE on
# first boot, encrypts them with KMS, and stores the ciphertexts in the
# vsock-proxied persistent store. Never put secrets in this file.
#
# IDENTITY: The VTA auto-generates its did:webvh identity on first boot
# using vta_did_template (see [tee.kms]). The DID is persisted in the
# encrypted store. Retrieve the did.jsonl via GET /attestation/did-log.
#
# NETWORKING: The enclave has no direct network access. All traffic is
# proxied through vsock to the parent EC2 instance:
#   REST API      → vsock :5100     (the VTA listens on vsock itself; the
#                                       parent's proxy forwards to it)
#   HTTPS + WSS   → 127.0.0.1:4444  (HTTP CONNECT proxy to parent)
#   DID resolver  → 127.0.0.1:4445  (WebSocket to resolver sidecar)
#   IMDS          → 169.254.169.254  (AWS credentials via parent)
# =============================================================================


# ── Top-level settings ──────────────────────────────────────────────────────

# DID resolver — connects to the resolver sidecar on the parent via vsock.
# Only change this if you use a different resolver port.
# The sidecar keeps its own DID-document cache (`expire` in its
# cache-conf.toml): a revoked key can keep verifying here for up to
# [did_cache] ttl_secs + that expire. See deploy/nitro/README.md.
resolver_url = "ws://127.0.0.1:4445/did/v1/ws"

# Uncomment to set the VTA's public REST URL (advertised in its DID document
# as the REST service endpoint). Not needed for DIDComm-only mode.
# public_url = "https://vta.example.com"

# Uncomment to set a manually-created VTA DID instead of auto-generating.
# When set, vta_did_template is ignored.
# vta_did = "did:webvh:..."


# ── REQUIRED: KMS bootstrap ─────────────────────────────────────────────────
#
# The VTA uses AWS KMS to protect its secrets. On first boot it generates
# a seed + JWT key inside the TEE, encrypts them with this KMS key, and
# stores the ciphertexts persistently. On subsequent boots it decrypts
# them using Nitro attestation-conditioned KMS access.
#
# Prerequisites:
#   1. Create a KMS key in your AWS account
#   2. Attach the Nitro attestation policy (see deploy guide)
#   3. Paste the key ARN below
#
[tee.kms]
region = "us-east-1"
key_arn = "REPLACE_WITH_KMS_KEY_ARN"

# Super-admin DID — grants unrestricted access to this VTA on first boot.
# Generate a did:key locally (e.g., via `pnm setup`) and paste it here.
# The private key stays on your machine — it never touches the TEE or parent.
#
# PROVENANCE WARNING: the enclave refuses to boot with `admin_did` set **only
# when this config was delivered by the untrusted parent over vsock** (an
# un-baked config is not attested, so a parent-supplied super-admin can't be
# trusted). A **baked/mounted** config is committed to PCR0 (or is local-dev
# input), so `admin_did` is fine there. For the un-baked (vsock) path leave it
# unset and use the attested sealed-bootstrap flow (Mode B, POST /bootstrap/request).
#
# If omitted, the VTA generates a random did:key and stores the credential in the
# bootstrap keyspace; claim it via the attested `pnm bootstrap connect --vta-url
# <URL>` flow (the old `GET /attestation/admin-credential` endpoint was retired).
# admin_did = "did:key:z6Mk..."

# Template for auto-generating the VTA's did:webvh identity on first boot.
# {SCID} is replaced with the self-certifying identifier at creation time.
# The domain must match where you'll host the did.jsonl file.
#
# Examples:
#   "did:webvh:{SCID}:vta.example.com"
#   "did:webvh:{SCID}:example.com:agents:vta-1"
#   "did:webvh:{SCID}:example.com%3A8080:vta"    (with port)
#
# Ignored if vta_did is set (either in this file or in the encrypted store).
# vta_did_template = "did:webvh:{SCID}:example.com:vta"


# ── REQUIRED: DIDComm mediator ──────────────────────────────────────────────
#
# The VTA communicates via DIDComm through a mediator. Set mediator_did to
# the DID of your Affinidi Messaging mediator. The TDK resolves this DID
# to discover the mediator's WebSocket endpoint automatically.
#
# WebSocket traffic is routed through the enclave's HTTPS_PROXY (set by
# the entrypoint) via the parent's HTTP CONNECT proxy. The mediator host
# is auto-added to the proxy allowlist from the DID.
#
[messaging]
mediator_did = "REPLACE_WITH_MEDIATOR_DID"


# ── TEE settings ────────────────────────────────────────────────────────────

[tee]
mode = "required"

# ── Server (rarely need to change) ──────────────────────────────────────────

[server]
host = "127.0.0.1"
port = 8100
# `host`/`port` are unused in the enclave: the entrypoint sets
# VTA_REST_VSOCK_PORT and the VTA serves REST on vsock, opening no TCP port.
#
# This one list is read by two programs, for two different peers:
#
#   0.0.0.3/32    the VTA's. Inbound reaches it over vsock from the parent
#                 only, reported as the peer 0.0.0.3 — never a valid TCP
#                 source — so every client shares that peer and the per-IP
#                 limiters would share one bucket. Trusting it splits them
#                 apart and trusts nothing but the parent (the old in-enclave
#                 socat made the peer 127.0.0.1, which anything inside the
#                 enclave could also be). Sound only because
#                 `deploy/nitro/enclave-proxy` terminates HTTP on the parent and
#                 sets `X-Forwarded-For` from the address it accepted
#                 (`src/http_forward.rs`).
#   127.0.0.1/32  the parent proxy's (`trusted_upstream_cidrs`): a TLS
#                 terminator on the parent's own loopback in front of it, whose
#                 `X-Forwarded-For` it extends rather than discards. The VTA
#                 binds no TCP in the enclave, so no VTA peer is ever 127.0.0.1;
#                 on vsock it reads a trusted 127.0.0.1 as the legacy name for
#                 the parent (the old socat hop) and trusts 0.0.0.3 with it, so a
#                 config that lists only 127.0.0.1/32 keeps working. Listing
#                 0.0.0.3/32 says so explicitly.
#
# Delete this line if you front the enclave with anything that bridges bytes
# rather than rewriting that header — `parent-proxy.sh` does, and refuses to
# start while this is set. A layer-4 forwarder plus this line lets every
# client pick its own rate-limit bucket.
trust_xff_cidrs = ["127.0.0.1/32", "0.0.0.3/32"]

[log]
level = "info"
format = "json"

[store]
data_dir = "/var/lib/vta/data"
