[package]
name = "vta-mcp"
description = "Model Context Protocol (MCP) server exposing a VTA's agent capabilities as tools"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Session mode reads a `pnm`/`cnm` login out of the OS keyring, and without a
# session backend compiled in it cannot read anything at all — it fails with
# "this build has no session store compiled in". That made the default auth
# mode, and the one this crate's README documents first, impossible. On by
# default, exactly as `pnm-cli` and `cnm-cli` have it.
default = ["keyring"]
keyring = ["vta-sdk/keyring"]
config-session = ["vta-sdk/config-session"]

[dependencies]
# `acl-setup` makes `DIDCommSession::connect` set this client's mediator ACL to
# accept-all on connect (`vta_sdk::acl_setup::set_client_acl_on_connection`).
# Without it the MCP server's ACL is never configured and the mediator silently
# drops message types it was not told to accept.
vta-sdk = { path = "../vta-sdk", version = "0.28", features = ["client", "session", "sealed-transfer", "didcomm", "vp", "crypto-provider", "acl-setup"] }
# `elicitation` is what lets the bridge put a destructive operation back in
# front of a human. An MCP host approves a *tool*; once `vta_call` is approved,
# every Trust Task URI rides that one approval, so per-operation consent has to
# be asked for from this side. Without the feature there is no `Peer::elicit`
# and `--confirm` could only ever deny.
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars", "elicitation"] }
schemars = "1"
chrono = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["env"] }
