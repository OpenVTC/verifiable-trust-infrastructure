# Dependabot version updates.
#
# Security *alerts* were already on — they are a repo-level default, and they
# are what surfaced the three `rustls-webpki` advisories fixed in #1158. What
# was missing is version updates: nothing proposed an ordinary bump, so the
# tree drifted until someone went looking. #1158 was that someone, by hand.
#
# The point of this file is that the next one is a pull request instead.

version: 2
updates:
  # ── Rust ──────────────────────────────────────────────────────────────
  # One workspace, one manifest directory as far as Dependabot is concerned:
  # it reads the root `Cargo.toml` + `Cargo.lock` and covers every member.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release is at its most dangerous in the days before anyone has looked
    # at it: a hijacked maintainer account or a retagged release is noticed by
    # the ecosystem within about a week, and this makes Dependabot wait that
    # week before proposing it. SECURITY updates are NOT subject to the
    # cooldown, so an advisory still arrives the day it lands.
    cooldown:
      default-days: 7
    # Enough headroom for a normal week without burying the queue. A security
    # advisory is not subject to this cap.
    open-pull-requests-limit: 5
    commit-message:
      # `chore`, not `chore(deps)`: `include: scope` appends the scope itself,
      # so a prefix that already carries one yields `chore(deps)(deps): …`,
      # which the commit-lint regex rejects. It checks the PR *title*, so every
      # Dependabot PR opened under the first version of this file was red on a
      # check that had nothing to do with the bump.
      prefix: "chore"
      # `!` is added by hand when a bump is breaking — the commit lint accepts
      # `chore(deps)!:`, and a bot cannot tell which bumps deserve it.
      include: scope
    groups:
      # Patch and minor bumps are the bulk of the noise and almost never need
      # to be read individually. Grouping them keeps the interesting PRs —
      # the majors — legible.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # The AWS SDK releases as a set of ~10 crates that must move together;
      # ungrouped, one week's bump is ten PRs that each fail to build alone.
      aws-sdk:
        patterns:
          - "aws-*"
    ignore:
      # Owned by this workspace and released by release-plz. Dependabot would
      # race it and propose bumps for crates the release PR is already moving.
      - dependency-name: "vta-*"
      - dependency-name: "vti-*"
      - dependency-name: "vtc-*"
      # `cnm-cli`'s dev-dependency, held at 0.8 by rPGP. `pgp` 0.20 — the
      # latest release — takes an `R: CryptoRng + Rng` from the rand 0.8 trait
      # set for key generation, and the bootstrap tests hand it a seeded
      # `StdRng` so the generated web of trust has stable fingerprints. A 0.10
      # bump was proposed (#1445) and cannot build: `StdRng: rand_core::
      # CryptoRng is not satisfied`. The workspace itself is already on 0.10,
      # and that copy is unaffected. Lift this when the OpenPGP stack moves.
      - dependency-name: "rand"

  # ── GitHub Actions ────────────────────────────────────────────────────
  # Every `uses:` in this repo is a full 40-hex commit SHA with the version in
  # a trailing `# vX.Y.Z` comment. That is the form Dependabot understands: it
  # moves the SHA and rewrites the comment, so pinning costs nothing in
  # freshness.
  #
  # The two refs this comment used to excuse are gone. `dtolnay/rust-toolchain`
  # published no tags at all — `@stable` and `@master` are branches — so it was
  # replaced with the `rustup` lines it was running for us, and
  # `taiki-e/install-action@cargo-semver-checks` (a tool-named tag, re-pointed
  # on every release of that tool) is now the pinned `v2` action with
  # `with: tool:`. Nothing here is unversionable any more.
  #
  # Weekly, not monthly: a pinned action only moves when something here moves
  # it, and a month of latency on a fixed action bug is a month of running the
  # bug. The grouping below still makes it one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release is at its most dangerous in the days before anyone has looked
    # at it: a hijacked maintainer account or a retagged release is noticed by
    # the ecosystem within about a week, and this makes Dependabot wait that
    # week before proposing it. SECURITY updates are NOT subject to the
    # cooldown, so an advisory still arrives the day it lands.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # ── Container base images ─────────────────────────────────────────────
  # Two Dockerfiles at the repo root: the service image and the Nitro enclave
  # image. A stale base is how a patched CVE fails to reach the artifact even
  # when the Rust tree is clean.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # A release is at its most dangerous in the days before anyone has looked
    # at it: a hijacked maintainer account or a retagged release is noticed by
    # the ecosystem within about a week, and this makes Dependabot wait that
    # week before proposing it. SECURITY updates are NOT subject to the
    # cooldown, so an advisory still arrives the day it lands.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"

  # ── Rust: the Nitro parent-instance proxy ─────────────────────────────
  # `deploy/nitro/enclave-proxy` is its OWN workspace with its own
  # `Cargo.lock`, and the root `Cargo.toml` lists it under `exclude` because
  # tokio-vsock is Linux-only and it therefore cannot build on a macOS
  # developer machine. The `/` entry above reads the root manifest and so has
  # never seen it: until this entry, nothing proposed a bump for the process
  # that terminates TLS in front of the enclave, and its lockfile was updated
  # only when someone remembered.
  #
  # Its manifest asks for versions to be kept aligned with the workspace by
  # hand. That is still true — this only makes the drift visible as a pull
  # request instead of leaving it to be discovered.
  - package-ecosystem: cargo
    directory: /deploy/nitro/enclave-proxy
    schedule:
      interval: weekly
      day: monday
    # A release is at its most dangerous in the days before anyone has looked
    # at it: a hijacked maintainer account or a retagged release is noticed by
    # the ecosystem within about a week, and this makes Dependabot wait that
    # week before proposing it. SECURITY updates are NOT subject to the
    # cooldown, so an advisory still arrives the day it lands.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
