name: Docker

# Both Dockerfiles are deployment artifacts, so they need a build that actually
# runs — an unbuilt Dockerfile rots the moment a native dependency, feature
# name, or toolchain version moves, and the failure then lands on whoever is
# trying to deploy. The Nitro image is the sharper case: its failures surface at
# `nitro-cli build-enclave` time or, worse, as a binary that will not start
# inside an enclave you cannot shell into.
#
# Path-filtered rather than run on every PR: a cold release build in a container
# takes tens of minutes, and the container-specific risks are all
# manifest/toolchain-shaped. Ordinary source changes are already covered by the
# `Clippy` / `Test` jobs in ci.yml, which compile the same crates.
#
# Two more triggers, for the reproducibility check only (see its job): weekly,
# and by hand.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main, nightly]
    # Duplicated below rather than shared via a YAML anchor: the Actions
    # workflow parser does not support anchors/aliases.
    paths:
      - "Dockerfile"
      - "Dockerfile.nitro"
      - ".dockerignore"
      - "deploy/nitro/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
      - ".github/actions/add-swap/**"
      - ".github/actions/docker-image/**"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.nitro"
      - ".dockerignore"
      - "deploy/nitro/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
      - ".github/actions/add-swap/**"
      - ".github/actions/docker-image/**"

# Read-only by default. The one exception is `image-main`, which writes the
# BuildKit registry cache and is given `packages: write` for that alone.
permissions:
  contents: read

# ── Build cache (#2652) ────────────────────────────────────────────────────
#
# A BuildKit REGISTRY cache on ghcr, one image per Dockerfile:
#
#   ghcr.io/openvtc/vti-buildcache:vta        (Dockerfile)
#   ghcr.io/openvtc/vti-buildcache:vta-nitro  (Dockerfile.nitro)
#
# `mode=max`, so every stage's layers are kept, the cargo-chef `cook` layer (the
# compiled dependency tree, the expensive part) among them. A build whose
# recipe.json is unchanged — a version bump, a source-only manifest edit —
# restores it and compiles only the workspace.
#
# Not the Actions cache (`type=gha` / actions/cache). That allowance is 25 GB
# for the whole repository, and ci.yml's compiled caches already fill it
# (25.8 GB in 16 entries on 2026-11-11, scripts/prune-superseded-caches.py):
# a multi-GB dependency layer there would evict CI's own caches, and the jobs
# that then restored a foreign tree are how the runners once ran out of disk.
# ghcr storage is separate from that allowance.
#
# Written from main only, by `image-main`, the one job holding `packages:
# write`. Pull requests and nightly read it and write nothing, so a branch can
# never put layers into the cache main builds from.

jobs:
  image:
    name: Docker image (${{ matrix.name }})
    # Pull requests and pushes to nightly; main is `image-main` below. Not on
    # the Release PR: it changes only versions and changelogs, and its merge
    # is a push to main, which builds both images.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push')
      && github.ref != 'refs/heads/main'
      && !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read the cache. A fork's token cannot; its build is cold, not red.
      packages: read
    # A cold release build of the workspace runs ~15 min for the non-TEE image;
    # the enclave build pulls the whole AWS SDK / TEE stack on top. The cap is
    # there to kill a hang, not to bound the normal build.
    timeout-minutes: 90
    strategy:
      # Report both images independently — knowing only the enclave build broke
      # is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - name: non-TEE
            file: Dockerfile
            tag: vta:ci
            cache: vta
            # `vta` declares `version` in its clap command; `vta-enclave` does
            # not, so only this one can be smoke-tested with --version.
            binary: /usr/local/bin/vta
            expect_non_root: true
          - name: nitro
            file: Dockerfile.nitro
            tag: vta-nitro:ci
            cache: vta-nitro
            binary: /usr/local/bin/vta-enclave
            # The enclave entrypoint needs root for `ip link set lo up` and the
            # socat vsock proxies; Nitro provides hardware isolation instead of
            # a user boundary. Asserting non-root here would be wrong.
            expect_non_root: false
    steps:
      # Nothing in this job pushes to the repository, so the checkout keeps no
      # credentials. By default actions/checkout leaves the job's token in
      # `.git/config`, where every later step — including a build script and
      # every third-party action in the job — can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit compiles inside this runner's memory, and trust-tasks-rs with
      # every spec does not fit in it at release settings; see
      # .github/actions/add-swap.
      - uses: ./.github/actions/add-swap

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr (read the build cache)
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/docker-image
        with:
          file: ${{ matrix.file }}
          tag: ${{ matrix.tag }}
          cache-ref: ghcr.io/openvtc/vti-buildcache:${{ matrix.cache }}
          binary: ${{ matrix.binary }}
          expect-non-root: ${{ matrix.expect_non_root }}

  image-main:
    name: Docker image (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writes the registry cache, and nothing else: the images themselves are
      # still built with `push: false`.
      packages: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The same two images as `image` above, by hand: the workflow parser
      # this was first written against did not take YAML anchors.
      matrix:
        include:
          - name: non-TEE
            file: Dockerfile
            tag: vta:ci
            cache: vta
            binary: /usr/local/bin/vta
            expect_non_root: true
          - name: nitro
            file: Dockerfile.nitro
            tag: vta-nitro:ci
            cache: vta-nitro
            binary: /usr/local/bin/vta-enclave
            expect_non_root: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/add-swap

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr (write the build cache)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/docker-image
        with:
          file: ${{ matrix.file }}
          tag: ${{ matrix.tag }}
          cache-ref: ghcr.io/openvtc/vti-buildcache:${{ matrix.cache }}
          write-cache: "true"
          binary: ${{ matrix.binary }}
          expect-non-root: ${{ matrix.expect_non_root }}

  reproducible:
    # #2653: is the Nitro image a function of the commit? Its runtime layers
    # feed PCR0, the enclave's attestation anchor (`pnm bootstrap connect
    # --expect-pcr0`, the KMS key policy), so a third party should be able to
    # rebuild a commit and arrive at the same PCR0, and a rebuild should not
    # lock the enclave out of its own KMS key.
    #
    # Builds Dockerfile.nitro twice, each on a FRESH BuildKit builder with no
    # cache of any kind (a second build on the same builder is a cache hit and
    # proves nothing), with SOURCE_DATE_EPOCH at the commit time and
    # `rewrite-timestamp=true` so file times are not a difference, and compares
    # the two image manifests layer by layer.
    #
    # Weekly and by hand, not on every pull request: two cold enclave builds
    # are ~1 hour of runner time (a cold one is 22-28 minutes), which would
    # double the cost of every Docker run the registry cache above exists to
    # cut. What it measures (digest-pinned bases, pinned apk packages, a
    # deterministic compile) changes rarely and is not specific to a diff.
    name: Nitro image is reproducible
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/add-swap

      # Two complete builder states (~15 GB each at peak) do not fit beside
      # the preinstalled toolchains; each builder is removed after its build.
      # Do NOT remove $AGENT_TOOLSDIRECTORY (see ci.yml's Test job).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build twice on fresh builders and compare
        run: bash scripts/check-nitro-reproducible.sh
