name: Release-plz

# THE FILENAME OF THIS FILE IS LOAD-BEARING. Do not rename it.
#
# crates.io Trusted Publishing is configured per crate against a specific
# repository + workflow FILENAME, and every crate here is registered against
# `publish.yml`. Renaming this file to release-plz.yml made the OIDC exchange
# fail before any release logic ran:
#
#   Failed to retrieve token from Cargo registry. Status: 400.
#   The Trusted Publishing config ... does not match the workflow filename
#   `release-plz.yml` in the JWT. Expected workflow filenames: `publish.yml` ...
#
# To rename it you must first update the Trusted Publisher config of every
# published crate on crates.io. Not worth it — the name is ours to choose, the
# registry's expectation is not.

# Versioning, changelogs and publishing. Replaces the old publish.yml, which
# fired on every push to main and published whatever versions were newly
# present — making a version bump the release trigger, and therefore making
# every feature PR a release decision taken days before it merged.
#
# Now: merge PRs freely. `release-pr` keeps a single Release PR up to date with
# the bumps and changelog entries those merges imply. Merging THAT PR is the
# release — `release` then tags each crate and publishes it. See RELEASING.md.
#
# Which crates publish is decided in the manifests (`publish = false` on the 14
# internal ones), not here.

on:
  push:
    # release/** — a named release's branch publishes its own crate patches
    # (RELEASES.md). Only the `release` job runs there; its versions come from
    # scripts/prepare-release-branch.py, not the Release PR.
    branches: [main, "release/**"]
  # Recovery hatch. release-plz publishes the workspace in one pass, and a
  # single crate failing leaves the release *half-shipped* — consumers can
  # resolve the crates that made it and not the ones that did not.
  #
  # That happened: release-plz attempted `vta-backup` before `vta-webvh`,
  # which `vta-backup` depends on non-optionally, so the requirement
  # `vta-webvh = "^0.2"` could not resolve and eleven of nineteen crates
  # shipped. Re-running changed nothing, because the ordering is
  # deterministic, and with `push` as the only trigger there was no way to
  # publish the one blocking crate from CI. It had to be done from a laptop
  # with a personal crates.io token — the exact thing Trusted Publishing
  # exists to avoid.
  #
  # `package` publishes one crate and stops, which is enough to unblock a
  # stalled ordering; leaving it empty behaves exactly as a push does.
  workflow_dispatch:
    inputs:
      package:
        description: >-
          Publish only this crate (leave empty to publish everything not yet
          on crates.io, as a push to main would).
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-plz-release:
    # Runs on every push to main, but only *does* anything when a crate's
    # version is not yet on crates.io — which in practice means immediately
    # after the Release PR merges. An ordinary feature merge is a no-op.
    name: Release-plz release
    runs-on: ubuntu-latest
    # Three publishing passes of up to 30 minutes each (one per token), plus
    # setup. See "Run release-plz" below.
    timeout-minutes: 110
    permissions:
      contents: write
      pull-requests: read
      # OIDC token exchange with crates.io. Trusted Publishing means no
      # long-lived registry token is stored in this repo; crates.io mints a
      # short-lived one per run after verifying the workflow's identity.
      # See docs/05-design-notes/trusted-publishing.md.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: release-plz diffs each crate against the
          # commit its last release was tagged at.
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      # rustup from the runner image, not dtolnay/rust-toolchain: that action
      # offers only branch refs, so there is nothing immutable to pin. See the
      # longer note in ci.yml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Checked before the Trusted Publishing exchange below, so a malformed
      # `package` fails the run before a registry token exists. The value is
      # read from the environment, never spliced into the script, and `[[ =~ ]]`
      # anchors the whole string (a line-oriented `grep` would accept a value
      # whose first line is a crate name).
      - name: Validate the recovery input
        if: inputs.package != ''
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          [[ "$PACKAGE" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] \
            || { echo "::error::package must be a crate name"; exit 1; }

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Single-crate recovery. Deliberately `cargo publish` rather than
      # release-plz: the thing being worked around IS release-plz's ordering,
      # so routing the fix back through it would inherit the problem. Note
      # `release-plz/action` has no `args` input (checked against v0.5.131 —
      # command, registry, config, forge, backend, manifest_path,
      # project_manifest, version, token, verbose, dry_run, prs, pr, releases),
      # so there is no way to pass `--package` through it at all; a `with: args:`
      # would be accepted by YAML and silently ignored.
      - name: Publish one crate
        if: inputs.package != ''
        run: cargo publish -p "$PACKAGE"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ inputs.package }}

      # A crates.io Trusted Publishing token lives 30 minutes, and release-plz
      # publishes the whole workspace in one pass on one token. A large release
      # (30+ crates, each packaged and verify-built) outlives it: the #1821
      # release published 29 crates and then failed on the 30th with
      # `403 Forbidden: Invalid authentication token`, exactly 30 minutes after
      # the exchange. So the pass is retried, each time on a freshly minted
      # token. A retry is cheap and safe — release-plz skips every crate whose
      # version is already on crates.io and resumes with the first that is not.
      # A failure that is not the token (a broken ordering, a build error)
      # fails the same way on each attempt, and the last step reports it.
      - name: Run release-plz
        id: release1
        # Skipped when recovering a single crate — that run has already done
        # its one job, and letting release-plz follow would re-attempt the same
        # broken ordering in the same run.
        if: inputs.package == ''
        continue-on-error: true
        # Pinned to a full version: release-plz/action does NOT publish a
        # moving major tag, so `@v0` resolves to nothing and the job fails at
        # "Set up job" before running a step. (actions/checkout@v6 works
        # because that repo does publish v6 — the convention is not universal.)
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          # The Actions token cannot create tag refs here: on 2026-10-01 every
          # tag for the #1861 release failed with 403 "Resource not accessible
          # by integration" after its crate published, so each pass published
          # one crate and stopped. The PR job below already prefers this PAT.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Re-authenticate to crates.io (attempt 2)
        if: inputs.package == '' && steps.release1.outcome == 'failure'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth2

      - name: Run release-plz (attempt 2)
        id: release2
        if: inputs.package == '' && steps.release1.outcome == 'failure'
        continue-on-error: true
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          # The Actions token cannot create tag refs here: on 2026-10-01 every
          # tag for the #1861 release failed with 403 "Resource not accessible
          # by integration" after its crate published, so each pass published
          # one crate and stopped. The PR job below already prefers this PAT.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth2.outputs.token }}

      - name: Re-authenticate to crates.io (attempt 3)
        if: inputs.package == '' && steps.release2.outcome == 'failure'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth3

      - name: Run release-plz (attempt 3)
        id: release3
        if: inputs.package == '' && steps.release2.outcome == 'failure'
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          # The Actions token cannot create tag refs here: on 2026-10-01 every
          # tag for the #1861 release failed with 403 "Resource not accessible
          # by integration" after its crate published, so each pass published
          # one crate and stopped. The PR job below already prefers this PAT.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth3.outputs.token }}

      # On a release branch, once its crates are out: tag the named release
      # `RELEASE` names (VTI-Fig-RC-0, VTI-Fig, VTI-Fig-R1 …) if it is not
      # tagged yet, with the bill of materials — every published crate's
      # version at this commit — as its notes. A push that changes nothing
      # (a backport, before the prep PR) finds the tag already there.
      #
      # Never "latest": that belongs to main's line. An RC is a prerelease.
      # "Already tagged" is read from the tag, not a GitHub Release: the tags
      # before this tooling (VTI-Dogwood-R1 …) mostly have no Release, and a
      # branch cut at one must not mint a Release for it at a later commit.
      - name: Tag the named release
        if: success() && startsWith(github.ref, 'refs/heads/release/') && inputs.package == ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rel=$(cat RELEASE)
          [[ "$rel" =~ ^VTI-[A-Z][a-z]+(-RC-[0-9]+|-R[0-9]+)?$ ]] || { echo "::error::RELEASE holds '$rel'"; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$rel" >/dev/null 2>&1; then
            echo "$rel is already tagged"; exit 0
          fi
          {
            echo "Named release **$rel**, \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`. See RELEASES.md."
            echo
            echo "| Crate | Version |"
            echo "|---|---|"
            python3 - <<'PY'
          import json, subprocess
          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              capture_output=True, text=True, check=True).stdout)
          for p in sorted(meta["packages"], key=lambda p: p["name"]):
              if p.get("publish") is None:
                  n, v = p["name"], p["version"]
                  print(f"| [`{n}`](https://crates.io/crates/{n}/{v}) | {v} |")
          PY
          } > "$RUNNER_TEMP/notes.md"
          pre=()
          [[ "$rel" == *-RC-* ]] && pre=(--prerelease)
          gh release create "$rel" --target "$GITHUB_SHA" --title "$rel" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest=false "${pre[@]}"

  release-plz-pr:
    name: Release-plz PR
    # Push, plus the recovery hatch. The Release PR tracks what has landed on
    # main, so a dispatch usually regenerates the same PR for nothing — but
    # "usually" is not "always": if this job is dropped (see the concurrency
    # note below) the PR is left describing an older main, and a dispatch is
    # then the cheapest way to bring it back in line without re-running a
    # specific job by id.
    #
    # main only: on a release branch the Release PR would derive versions from
    # main's newer crates on crates.io (scripts/prepare-release-branch.py).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 60, not 30, because this job's cost scales with **how many crates changed
    # since their last release** — release-plz semver-checks each one against
    # its published baseline. An ordinary merge touches a few; a workspace-wide
    # dependency move touches all of them.
    #
    # Measured on 2026-09-16, same day, same workflow:
    #
    #     07:09  19m14s  success
    #     09:32  20m11s  success
    #     12:59  22m58s  success
    #     15:08  30m26s  CANCELLED — timed out
    #
    # The last of those is the merge of #1512, which moved every `affinidi-*`
    # pin at once. The budget had been creeping toward the ceiling for a while
    # and that change went through it.
    #
    # The failure mode is worth knowing because it is silent in the way that
    # matters: the job is cancelled, the `Release-plz release` job beside it
    # stays green, and the Release PR is simply **left describing an older
    # main** — no error on the PR, nothing red pointing at it. Exactly the
    # shape of the stale-PR hazard the concurrency note below describes, via a
    # different route. Read a Release PR's `updatedAt` against main's HEAD
    # before merging it; do not assume it regenerated.
    #
    # For scale: CI's own `semver report` job covers a broader crate set, is
    # given 45 minutes, and uses 41–44 of them. 60 matches
    # `release-plz-release` above and leaves real headroom rather than the
    # thin margin that just failed.
    #
    # 120, not 60: after a change that moves vta-sdk and vti-common to breaking
    # versions, semver-checks runs over nearly every published crate. The run for
    # #1859 was cancelled at 60 min and the Release PR had to be regenerated by hand.
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Deliberately only on this job. Serialising the release job could skip a
      # release; serialising PR updates is safe because the Release PR is a pure
      # function of main's HEAD — regenerate it from the newest commit and the
      # result is correct regardless of how many pushes were coalesced.
      #
      # `cancel-in-progress: true` precisely because of that. It used to be
      # `false`, on the reasoning that serialising "just coalesces" the updates.
      # It does not: GitHub keeps at most one *pending* run per group and drops
      # the rest, so a burst of merges can discard the run for the newest commit
      # and leave the older one to finish. That happened — four PRs merged
      # within a few minutes and the surviving run produced a Release PR that
      # was missing the last of them, with an empty changelog section for the
      # crate that commit had changed. The PR still looked mergeable.
      #
      # With `true`, the newest push wins: an older in-flight regeneration is
      # cancelled and loses nothing, because its output was already stale. The
      # worst case is a cancelled force-push leaving the release branch
      # half-updated, which the next push regenerates.
      group: release-plz-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # release-plz compares each crate's public API against its published
      # version and forces a compatibility-breaking bump when it actually
      # broke. Without this binary present release-plz logs "cargo-semver-checks
      # not installed, skipping semver check" and silently falls back to
      # guessing from commit messages — which is the failure this exists to
      # prevent, and it is only a warning, so nothing goes red.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks

      # `cargo-semver-checks` on `vta-service` peaks at **5.3 GB** resident
      # (measured: 146 s and 5,311,905,792 bytes max RSS, warm cache). An
      # `ubuntu-latest` runner has 7 GB total, and the check rustdocs the crate
      # twice — current and baseline — on top of a cold dependency build. It
      # does not fit, and the kernel kills it.
      #
      # ## Why this was hard to see, and what to look for next time
      #
      # A killed process logs nothing. The job's whole failure is:
      #
      #     INFO Checking API compatibility with cargo-semver-checks...
      #     ##[error]Process completed with exit code 143.
      #
      # No message, no crate named, no stack — just SIGTERM six minutes in,
      # well inside the 30-minute `timeout-minutes`, so it does not read as a
      # timeout either. It ran that way **sixteen consecutive times** (first
      # failure 2026-09-14 on #1470) while the `Release-plz release` job beside
      # it stayed green and kept publishing, so from outside it looked like
      # release-plz was not firing at all rather than half-failing. An exit 143
      # with no output in a memory-hungry step is the memory ceiling until
      # proven otherwise.
      #
      # ## Swap, rather than a bigger runner
      #
      # No workflow in this repo uses a larger-runner label, so moving there is
      # an org-level change with billing attached. Swap costs a few minutes of
      # paging on one job. If this step ever stops being enough, the next moves
      # are a larger runner or `semver_check = false` for `vta-service` in
      # `release-plz.toml` — the latter last, because that crate keeps the
      # check for a reason: `openvtc-core` dev-depends on it, so a silent break
      # reaches somebody (see RELEASING.md).
      #
      # `ubuntu-latest` ships a 4 GB swapfile at this path already; it is
      # replaced rather than added to, because a second `swapon` on the same
      # file fails.
      - name: Give the semver check room to run
        run: |
          set -euo pipefail
          sudo swapoff /mnt/swapfile || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Printed so a future failure can be read against real numbers rather
          # than the assumption that this step worked.
          free -h

      # Since 2026-10-03 this job has died the same silent way again, on every
      # push, 11-20 minutes into "Checking API compatibility" — a bare exit
      # 143, or "The runner has received a shutdown signal" / "The operation
      # was canceled" with no newer push to cancel it. The swap above was in
      # place every time (15 GiB RAM + 14 GiB swap), and the disk is not it:
      # #1938 measured 91 GB free on / when the run started.
      #
      # What changed is the workload. release-plz semver-checks every changed
      # crate in a pool of `available_parallelism` workers (4 here) and has no
      # setting for it; each check builds the crate's whole dependency tree
      # twice, the crates.io baseline into a target dir of its own. A release
      # touching one or two crates fits. The one pending since #1918 touches
      # eleven, so four cold builds of trees the size of vta-service's (5.3 GB
      # for its check alone) run at once, the VM thrashes and the runner agent
      # is lost.
      #
      # release-plz runs `cargo-semver-checks` from PATH, so a gate placed
      # ahead of the real binary bounds the concurrency: at most two checks at
      # once, each taking one of two flock slots. Two because two vta-service
      # sized checks fit in RAM + swap and halve the wall time of running them
      # one by one. The gate logs every check it admits; the log and a 30 s
      # memory sample are printed after the run, so if this recurs the log
      # says what was running when it did.
      - name: Bound concurrent semver checks
        run: |
          set -euo pipefail
          gate_dir="$RUNNER_TEMP/semver-gate"
          mkdir -p "$gate_dir/bin"
          real=$(command -v cargo-semver-checks)
          cat > "$gate_dir/bin/cargo-semver-checks" <<EOF
          #!/usr/bin/env bash
          # Generated by publish.yml: at most two concurrent semver checks.
          if [ "\${1:-}" = "--version" ]; then exec "$real" "\$@"; fi
          while true; do
            for slot in 1 2; do
              exec 9>"$gate_dir/slot-\$slot.lock"
              if flock -n 9; then
                echo "\$(date -u +%H:%M:%S) slot \$slot start \$*" >> "$gate_dir/gate.log"
                "$real" "\$@"; rc=\$?
                echo "\$(date -u +%H:%M:%S) slot \$slot exit \$rc" >> "$gate_dir/gate.log"
                exit \$rc
              fi
            done
            sleep 5
          done
          EOF
          chmod +x "$gate_dir/bin/cargo-semver-checks"
          echo "$gate_dir/bin" >> "$GITHUB_PATH"
          nohup bash -c 'while true; do date -u +%H:%M:%S; free -m | grep -E "^(Mem|Swap):"; sleep 30; done' \
            > "$gate_dir/memory.log" 2>&1 &

      - name: Run release-plz
        # Pinned to a full version: release-plz/action does NOT publish a
        # moving major tag, so `@v0` resolves to nothing and the job fails at
        # "Set up job" before running a step. (actions/checkout@v6 works
        # because that repo does publish v6 — the convention is not universal.)
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          # A PAT or GitHub App token, falling back to the default token.
          #
          # THE FALLBACK SHIPS A RELEASE NOBODY TESTED. GitHub suppresses
          # workflow runs for events authored by GITHUB_TOKEN, so with the
          # default token the Release PR opens with no CI on it. Only DCO is a
          # required check here, so it would still be *mergeable* — which is
          # the dangerous part: the one commit that publishes to crates.io
          # would be the one commit CI never built. The repo has hit the same
          # suppression before, on the self-pin refresh PR (#706/#711/#714/#720).
          #
          # Set RELEASE_PLZ_TOKEN to a PAT (contents + pull-requests write) or
          # a GitHub App token. Until then, close-and-reopen the Release PR to
          # trigger CI before merging it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Semver checks admitted, and memory, during release-plz
        if: always()
        run: |
          cat "$RUNNER_TEMP/semver-gate/gate.log" || true
          cat "$RUNNER_TEMP/semver-gate/memory.log" || true