name: Nightly

# Advances `nightly` to the newest main commit whose full CI run passed.
#
# main merges on a red suite as readily as a green one — only the cheap gates
# are required checks, never the tests (CLAUDE.md, "A merge is not evidence
# that anything passed") —
# so main's tip is not something to build a nightly from, or to cut a named
# release from. `nightly` is: a fast-forward-only pointer that moves only to a
# commit every CI job passed on. RELEASES.md cuts release branches from it.
#
# Read from each run's own jobs, not the run's conclusion: the rollup reports
# a re-run's staleness as success. A push to main runs every job (ci-affects.sh
# answers `run=true` for any non-PR event), so a skipped job here is one that
# is PR-only by design, never a filtered one.
#
# The ref is moved with the release token (.github/actions/release-token: the
# release GitHub App when configured, else RELEASE_PLZ_TOKEN), not GITHUB_TOKEN: a push made with
# GITHUB_TOKEN triggers no workflows, and the push to nightly is what runs
# ci.yml and docker.yml on it.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  advance:
    name: Advance nightly to the last green main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      # Validated first, so a bad token fails here by name rather than as a
      # 401 from the middle of the script (#2646).
      - name: Release token
        id: token
        uses: ./.github/actions/release-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          pat: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Find the newest fully green main commit and fast-forward to it
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Test the exit status, not the output: on a 404 `gh api` prints the
          # error body to stdout, so `$(… || true)` would hold that JSON.
          if ! current=$(gh api "repos/$REPO/git/ref/heads/nightly" --jq .object.sha 2>/dev/null); then
            current=""
          fi
          echo "nightly is at ${current:-<none>}"

          # Newest first. Only completed push runs on main whose latest attempt succeeded.
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' > runs.txt

          target=""
          while read -r id sha; do
            bad=$(gh api --paginate "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name')
            if [ -n "$bad" ]; then
              echo "skip $sha (run $id): $(echo "$bad" | tr '\n' ',' )"
              continue
            fi
            target=$sha
            echo "newest green: $sha (run $id)"
            break
          done < runs.txt

          if [ -z "$target" ]; then
            echo "::warning::no fully green main run among the last 30 — nightly stays at ${current:-<none>}"
            exit 0
          fi

          if [ -z "$current" ]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/nightly -f sha="$target" >/dev/null
            echo "created nightly at $target"
            exit 0
          fi

          status=$(gh api "repos/$REPO/compare/$current...$target" --jq .status)
          case "$status" in
            identical) echo "nightly already at $target" ;;
            ahead)
              # force=false: the API refuses anything but a fast-forward.
              gh api -X PATCH "repos/$REPO/git/refs/heads/nightly" -f sha="$target" -F force=false >/dev/null
              echo "nightly: $current -> $target" ;;
            *)
              echo "::error::newest green main ($target) is $status relative to nightly ($current); not moving it"
              exit 1 ;;
          esac
