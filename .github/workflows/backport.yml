name: Backport

# A merged PR labelled `backport release/<name>` is cherry-picked onto that
# release branch as a new PR (RELEASES.md: fix on main first, then backport).
# Add the label before or after merging; one label per target branch.
#
# A cherry-pick that conflicts still opens a PR, as a draft carrying the
# conflict, for a person to resolve — never silently dropped.
#
# pull_request_target, so it runs with this repository's token even for a PR
# from a fork. It checks out no PR code to run: the action only cherry-picks
# the commits a maintainer already merged. The PR is opened with
# RELEASE_PLZ_TOKEN because one opened with GITHUB_TOKEN triggers no workflows,
# and the backport needs CI (required on release/**).
#
# The cherry-pick keeps the original author and message, Signed-off-by
# included, so DCO passes, and keeps the conventional title, so the backport
# lands in the release branch's changelog under the same entry as on main.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

jobs:
  backport:
    name: Backport
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4.7.0
        with:
          github_token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          label_pattern: '^backport (release/[a-z]+)$'
          pull_title: '${pull_title}'
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.

            ${pull_description}
          add_labels: backport
          copy_assignees: true
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
