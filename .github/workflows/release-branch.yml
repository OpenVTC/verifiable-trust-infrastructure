name: Prepare a named release

# Opens the PR that prepares the next rc, GA or patch of a named release
# (RELEASES.md). Run it from the Actions tab with the release branch selected
# as the ref. Merging the PR it opens is the release: publish.yml publishes the
# patched crates and tags the release (VTI-<Name>-R<n> …, RELEASES.md).
#
# release-plz's Release PR does not run on release branches — it derives
# versions from the newest crate on crates.io, which is main's line. See the
# header of scripts/prepare-release-branch.py.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "rc (next candidate), ga (rcN -> .0) or patch (.N -> .N+1)"
        required: true
        type: choice
        options: [patch, rc, ga]

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.kind }} on ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags: every crate's last release is found by its `<crate>-v<version>` tag.
          fetch-depth: 0
          persist-credentials: false
      # Before the long part: a bad token fails here by name, not after an
      # hour of semver checks (#2646).
      - name: Release token
        id: token
        uses: ./.github/actions/release-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          pat: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install system dependencies
        run: bash scripts/install-build-deps.sh libtss2-dev
      # Stable, deliberately, not rust-toolchain.toml's pin: cargo-semver-checks
      # (installed below at its latest release) reads rustdoc JSON, whose format
      # changes with every Rust release, and supports a window of recent
      # formats rather than whatever the pin is. RUSTUP_TOOLCHAIN overrides the
      # toolchain file for every later step.
      - name: Install the Rust toolchain (stable, for cargo-semver-checks)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-semver-checks,git-cliff
      - name: Bump changed crates, write changelogs, move RELEASE
        env:
          KIND: ${{ inputs.kind }}
        run: python3 scripts/prepare-release-branch.py --kind "$KIND" --pr-body "$RUNNER_TEMP/body.md"
      # Minted again: the semver checks above can outlast an App installation
      # token's one-hour life.
      - name: Release token (for the push)
        id: push-token
        uses: ./.github/actions/release-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          pat: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Open the PR
        env:
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
          BASE: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target=$(cat RELEASE)
          head="release-prep/${BASE#release/}/$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$head"
          git add -A
          git commit -s -m "chore(release): $target"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$head"
          gh pr create --base "$BASE" --head "$head" --title "chore(release): $target" \
            --body-file "$RUNNER_TEMP/body.md" --label release
