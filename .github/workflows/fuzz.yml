name: Fuzz

# The cargo-fuzz harness in fuzz/ (#2645). Before this workflow nothing built
# it: nobody knew whether it still compiled against vta-sdk, and five of its
# seed corpora had no target. The parsers it covers are the ones that read
# bytes nobody has authenticated yet: Nitro attestation quotes, sealed-transfer
# armor, the bootstrap VP, SD-JWT-VC presentations, OID4VP `vp_token`s and
# OID4VCI proofs.
#
#   build  every pull request or push that touches fuzz/ or a crate whose
#          parsers it drives: all seven targets still compile.
#   run    nightly (and by hand): each target for a few minutes over its seed
#          corpus; a crash fails the job and uploads the reproducer.
#
# Nightly Rust, deliberately and only here: libFuzzer's instrumentation
# (`-Zsanitizer`) is nightly-only. Pinned to a dated nightly so the build does
# not break on a day's nightly; move the date on purpose. `cargo +<toolchain>`
# overrides rust-toolchain.toml's pin.
on:
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - "vta-sdk/**"
      - "vtc-service/src/credentials/exchange/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "vta-sdk/**"
      - "vtc-service/src/credentials/exchange/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FUZZ_TOOLCHAIN: nightly-2026-10-16
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'Fuzz targets run' || 'Fuzz targets build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # trust-tasks-rs with every spec does not fit in the runner's RAM; see
      # .github/actions/add-swap.
      - uses: ./.github/actions/add-swap

      - name: Install system dependencies
        run: bash scripts/install-build-deps.sh

      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update
          # From crates.io, checksummed by cargo, at a fixed version.
          cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"

      # fuzz/ keeps no lockfile of its own (fuzz/.gitignore): it would record
      # this workspace's own crate versions, which every release moves, and go
      # stale on the next Release PR. Starting from the root Cargo.lock instead
      # gives every third-party crate the version the workspace's own CI
      # tested; cargo adds only what the harness needs on top (libfuzzer-sys).
      - name: Build every target
        working-directory: fuzz
        run: |
          cp ../Cargo.lock Cargo.lock
          cargo +"$FUZZ_TOOLCHAIN" fuzz list
          cargo +"$FUZZ_TOOLCHAIN" fuzz build --release

      # Each target over a scratch corpus first (libFuzzer writes what it finds
      # into the FIRST directory) and its committed seeds second, so the seeds
      # stay as committed.
      - name: Run every target
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          set -uo pipefail
          [[ "$SECONDS_PER_TARGET" =~ ^[1-9][0-9]{0,4}$ ]] \
            || { echo "::error::seconds must be an integer from 1 to 99999"; exit 1; }
          failed=""
          # target:seed directory
          for pair in \
            fuzz_nitro_quote:nitro-quote \
            fuzz_nitro_verify:nitro-quote \
            fuzz_sealed_transfer_armor:sealed-transfer-armor \
            fuzz_bootstrap_request:bootstrap-request \
            fuzz_sd_jwt_presentation:sd-jwt-presentation \
            fuzz_vp_token:vp-token \
            fuzz_oid4vci_proof:oid4vci-proof; do
            target=${pair%%:*}
            seeds=${pair#*:}
            echo "::group::$target ($SECONDS_PER_TARGET s over seeds/$seeds)"
            mkdir -p "corpus/$target"
            if ! cargo +"$FUZZ_TOOLCHAIN" fuzz run --release "$target" "corpus/$target" "seeds/$seeds" \
                 -- -max_total_time="$SECONDS_PER_TARGET"; then
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::crashed:$failed — the reproducers are in this run's fuzz-artifacts upload"
            exit 1
          fi

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
