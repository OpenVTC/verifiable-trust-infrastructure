name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main]

# One live run per ref. Pushing a fixup to an open PR used to leave the
# superseded run executing and racing the new one for the same runner pool;
# a superseded PR run tells you nothing worth waiting for.
#
# Cancellation is scoped to pull requests on purpose. A push to main or
# nightly gates releases and is the record of what that commit did, so those
# runs are left to finish even when another lands on top.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

  # ── Build-artifact diet ──────────────────────────────────────────────────
  #
  # Applies to every job below. Both settings trade away things only a human
  # at a debugger wants, and both are set HERE rather than in a `[profile.dev]`
  # block so a local `cargo test` is completely unaffected.
  #
  # `debug = "line-tables-only"` keeps what CI actually reads — a panic
  # backtrace still names the file and line — and drops the rest of the DWARF,
  # which is the bulk of `target/`. Full `debug = 2` is what the Test job was
  # linking when it died: `rustc-LLVM ERROR: IO failure on output stream: No
  # space left on device`, then `ld terminated with signal 7 [Bus error]`,
  # while linking the `vta` test binary with the whole AWS SDK stack behind
  # `tee`. `debug = 0` would shrink it further and is the wrong trade: a
  # backtrace with no line numbers turns a one-line CI diagnosis into a local
  # repro.
  #
  # `CARGO_INCREMENTAL=0` because incremental compilation is a bet on a NEXT
  # build in the same tree, and CI jobs are one-shot. The `incremental/`
  # directory is pure cost here — twice over, since `target/` is cached, so
  # the bloat is paid again as cache upload, download, and against the repo's
  # 10 GB cache allowance.
  #
  # `test` is set alongside `dev`: `cargo test` compiles the crate under test
  # with the `test` profile and its dependencies with `dev`, so setting only
  # one leaves half the tree at full debuginfo.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          # `target/` is deliberately NOT cached. Every crate in this
          # workspace is a **path** dependency, so a source-only change does not
          # move `Cargo.lock` and therefore does not move this key: the job
          # restores a `target/` built from *other* source and reuses stale
          # artifacts. The failure names a field that is plainly there in the
          # diff, so it reads as the author's bug — see #1133, where a
          # clean-room checkout of the same commit compiled fine.
          #
          # The registry and git caches stay: content-addressed by package
          # version, so a stale entry is impossible by construction.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
          # Deliberately NO `${{ runner.os }}-cargo-` fallback on any job.
          # It let a job restore a DIFFERENT job's cache, whose `target/` was
          # built with other feature sets — so almost none of it is reusable
          # (fingerprints differ) while all of it costs disk and download time.
          # #891's Test failure logged the proof: `Cache restored from key:
          # Linux-cargo-features-…`, ~3 GB of the Feature-combos tree unpacked
          # before Test built its own, on a runner that then ran out of disk.
          # The same shared key is what let one fat Enclave cache evict the
          # repo's whole 10 GB allowance. Each job keeps its OWN prefix
          # fallback, which is what actually warms a branch build from main.

      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `cargo test --workspace` builds a test binary for every crate with
      # full debuginfo, and the total (target/ plus the linker's scratch)
      # runs the ubuntu-latest runner's ~14 GB of free root disk right to the
      # edge. It began failing intermittently with "No space left on device"
      # while linking the largest binary (libvta_service). The preinstalled
      # Android SDK, .NET and GHC toolchains are ~20 GB we never use, so
      # reclaiming them buys comfortable headroom. Test-only: no other job
      # links the whole workspace at once, so none needs this.
      # NB: do NOT remove $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) — it
      # holds the runner's node, and vtc-service's build.rs shells out to
      # `npm run build` for the admin UI. Android + .NET + GHC are ~13 GB we
      # never touch and are safe to reclaim.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          # `target/` is deliberately NOT cached. Every crate in this
          # workspace is a **path** dependency, so a source-only change does not
          # move `Cargo.lock` and therefore does not move this key: the job
          # restores a `target/` built from *other* source and reuses stale
          # artifacts. The failure names a field that is plainly there in the
          # diff, so it reads as the author's bug — see #1133, where a
          # clean-room checkout of the same commit compiled fine.
          #
          # The registry and git caches stay: content-addressed by package
          # version, so a stale entry is impossible by construction.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # The failure this guards against reports as `No space left on device`
      # from the runner's own log writer — no failing step, no job log, just a
      # red job that reads like a code failure. Printing the free space after
      # the cache restore means the next occurrence says so in one line.
      - name: Disk after cache restore
        run: df -h /

      - run: cargo test --workspace

      # #1243: `vtc-service`'s build.rs used to write into the source tree —
      # `npm install` refreshed `admin-ui/package-lock.json` (a
      # `rerun-if-changed` input of that same script) and `npm run build`
      # regenerated the `include_dir!`-baked bundle (312 compile inputs of the
      # lib). So every `cargo build` re-ran npm and recompiled the crate from
      # scratch, and every local `cargo test` / `clippy` / rust-analyzer
      # check-on-save paid for it. Cold-cache CI never builds the same tree
      # twice, which is exactly why this went unnoticed.
      #
      # The first build is allowed to do work — npm may normalise the lockfile
      # once against whatever npm the runner ships, which legitimately changes
      # its content. From there the tree has settled, so the last build must do
      # nothing at all.
      - name: vtc-service rebuild is a no-op
        run: |
          cargo build -p vtc-service
          cargo build -p vtc-service
          out=$(cargo build -p vtc-service 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'Compiling vtc-service'; then
            echo "::error::vtc-service recompiled with nothing changed (#1243). Something in \
          build.rs is writing to a path cargo watches, or into the include_dir!-baked bundle."
            echo "--- tracked files the build modified (empty means it was mtime-only) ---"
            git status --porcelain
            exit 1
          fi
          echo "third build did no work"
          # Informational: npm normalising the lockfile against the runner's
          # own npm is a content change, which is legitimately allowed to
          # rebuild once and is absorbed by the settle builds above. Worth
          # surfacing — a lockfile that npm rewrites on every clean checkout
          # should be regenerated and committed — but it is not this guard's
          # failure condition, so it must not block unrelated PRs.
          if ! git diff --quiet; then
            echo "::warning::the build modified tracked files:"
            git status --porcelain
            git diff --stat
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v6
        with:
          # `target/` is deliberately NOT cached. Every crate in this
          # workspace is a **path** dependency, so a source-only change does not
          # move `Cargo.lock` and therefore does not move this key: the job
          # restores a `target/` built from *other* source and reuses stale
          # artifacts. The failure names a field that is plainly there in the
          # diff, so it reads as the author's bug — see #1133, where a
          # clean-room checkout of the same commit compiled fine.
          #
          # The registry and git caches stay: content-addressed by package
          # version, so a stale entry is impossible by construction.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      # `--all-targets` so tests, benches and examples are linted too. Without
      # it clippy sees only the lib/bin targets, and dead code in `tests/`
      # accumulates unseen — a dead import sat on main after #1000 and only
      # surfaced when someone ran this flag by hand.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  msrv:
    # Verify the workspace builds against the rust-version declared in
    # the root `Cargo.toml`. CI's "stable" toolchain is usually newer
    # than the MSRV; without this job a `let-else` introduced under a
    # newer compiler can silently break consumers on the documented MSRV.
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same reclaim as the Test job, and for the same reason: this job
      # also links the whole workspace. It ran out of disk mid-`cargo
      # check` on #884 — an infrastructure failure that reads exactly like
      # a real MSRV break. Do NOT remove $AGENT_TOOLSDIRECTORY (see Test).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -E '^rust-version *= *"' Cargo.toml | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "Workspace MSRV: $msrv"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - uses: actions/cache@v6
        with:
          # `target/` is deliberately NOT cached here any more.
          #
          # It was, keyed on `hashFiles('**/Cargo.lock')` with a prefix
          # `restore-keys` fallback — and every crate in this workspace is a
          # **path** dependency, so changing one member's source does not move
          # `Cargo.lock` and therefore does not move the key. A PR that edits
          # `vta-policy` and nothing else restores `main`'s `target/`
          # byte-for-byte, and `cargo check` reuses the stale `vta-policy`
          # artifact: the build then fails on the *new* code with
          # `no field ... on type ...`, naming a field that is right there in
          # the source.
          #
          # That is a false red on a green tree, and it is the worst kind: it
          # points at the author's own diff. It failed #1133 exactly this way,
          # which a clean-room checkout of the same commit compiled without
          # complaint.
          #
          # The registry and git caches stay: they are content-addressed by
          # package version, so a stale entry is impossible by construction.
          # `cargo check` on a warm registry is under two minutes, which is not
          # worth a class of failure that costs an afternoon to disbelieve.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.msrv }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.msrv }}-

      - run: cargo check --workspace --locked

  deny:
    # cargo-deny enforces the advisory ignores documented in `deny.toml`
    # and catches new license / source / duplicate-dependency issues
    # before they land. The workspace already has a curated `deny.toml`
    # with justified ignores; this job just runs it.
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  semver-checks:
    # Compare each published crate's public API against the version on
    # crates.io. release-plz runs this too when it builds the Release PR, but
    # by then the change has already merged — here the author still has it in
    # hand.
    #
    # It reports; it does not fail the build. A breaking change is allowed in
    # this workspace (every crate is 0.x); what matters is that it is KNOWN, so
    # the release moves the compatibility field instead of shipping it as a
    # patch. release-plz enforces that automatically from the same signal.
    #
    # A third instance of that same confusion is recorded in
    # scripts/semver-report.sh: for several releases this job checked two crates
    # and stopped, because an unpublished workspace member aborts the run and a
    # truncated report is red in exactly the way a declared break is red. The
    # script now asserts coverage rather than only explaining the red.
    #
    # The name says "report" because the check list is the only place most
    # people meet this job, and there it is a bare name next to a red cross.
    # Called "semver checks" it is indistinguishable from a gate that broke —
    # which led to a serious proposal to delete it, on the reasoning that a
    # check failing on every PR protects nothing. The reasoning was sound; the
    # premise was wrong, and the premise came from the name. A job whose red is
    # expected should say so where the red is displayed, not only in a comment
    # nobody opens.
    name: semver report (informational — never blocks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks

      # Everything this job knows about its own failure modes now lives in
      # scripts/semver-report.sh, including the exclusion list and the reasons
      # for it. It moved out of the workflow for one reason: a guard that can
      # only run in CI cannot be tried before it is pushed, and the defect it
      # was missing was found by reading a CI log rather than by running
      # anything.
      #
      # The addition is a coverage assertion. Both previous guards asked *why
      # did it stop*; neither asked *did it cover everything*, and an
      # unpublished workspace member made `cargo semver-checks --workspace`
      # abort mid-run with an exit status indistinguishable from a declared
      # break. See the script header.
      - name: Check published crates for API breaks
        run: bash scripts/semver-report.sh

  release-bump-guard:
    # The one place the semver signal must BLOCK rather than report.
    #
    # Runs only on a release-plz branch, where every manifest already carries the
    # version about to be published. That is what makes the check meaningful
    # here and merely informational elsewhere: cargo-semver-checks derives the
    # release type from the real delta, so a failure means the PROPOSED BUMP IS
    # TOO SMALL — the release is about to ship a breaking change as a compatible
    # one, on a version consumers' caret requirements pick up automatically.
    #
    # It exists because release-plz's own semver check and this repo's disagreed,
    # and only release-plz's decided the version. On 2026-09-05 it proposed
    # `vti-common` 0.16.2 "(✓ API compatible changes)" against a baseline where
    # the same tool failed `enum_variant_added` on two exhaustive enums, and
    # `vta-sdk` 0.32.4 where 16 public wire structs had gained a field. Nothing
    # reconciled the two verdicts. This does.
    #
    # NO continue-on-error, unlike the report above. That is the entire point.
    name: release bump is large enough
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks
      - name: Check the proposed versions cover their API changes
        env:
          SEMVER_MODE: enforce
        run: bash scripts/semver-report.sh

  lockfile-self-pins:
    # Sibling guard to release-guards: the version bump can be correct and the
    # release still break if Cargo.lock pins a stale crates.io copy of one of
    # our own crates (a transitive dev-dep pulls vta-sdk back in from the
    # registry). `cargo publish --locked` verifies dependents against that
    # pinned copy. See the script header.
    #
    # Its own job, and deliberately NOT PR-only. This check compares workspace
    # manifest versions against Cargo.lock — a whole-tree invariant, not a diff
    # against a base ref — so it is meaningful on a push. While it lived as a
    # step inside release-guards it inherited that job's `if: pull_request`,
    # which meant a merge could leave the lockfile stale, main stayed green,
    # and the failure surfaced on whichever unrelated PR opened next. That
    # misattribution happened twice (#706, #711).
    name: lockfile self-pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lockfile self-pin guard
        run: bash scripts/check-lockfile-self-pins.sh

  features:
    # Build the most-used non-default feature combinations so a misuse
    # of `cfg(feature = "...")` doesn't silently rot. Default-feature
    # builds are covered by the `check` job above.
    name: Feature combos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          # `target/` is deliberately NOT cached. Every crate in this
          # workspace is a **path** dependency, so a source-only change does not
          # move `Cargo.lock` and therefore does not move this key: the job
          # restores a `target/` built from *other* source and reuses stale
          # artifacts. The failure names a field that is plainly there in the
          # diff, so it reads as the author's bug — see #1133, where a
          # clean-room checkout of the same commit compiled fine.
          #
          # The registry and git caches stay: content-addressed by package
          # version, so a stale entry is impossible by construction.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-

      - name: vta-service tee + webvh
        run: cargo check -p vta-service --no-default-features --features tee,rest,didcomm
      # DIDComm *without* webvh. Not covered by the step above, because `tee`
      # pulls `webvh` in — which is how this combination sat broken: three
      # trust-task call sites buffered into the `webvh`-gated
      # `AppState::mediator_registry` from inside `#[cfg(feature = "didcomm")]`
      # blocks. Naming `PendingResponse` only needs `didcomm`, so nothing failed
      # until someone built the pair on its own, and no CI step ever did.
      - name: vta-service didcomm without webvh
        run: cargo check -p vta-service --no-default-features --features rest,didcomm
      # REST on its own — the narrowest supported build. `-D warnings` because
      # this combination had accumulated six dead imports/constants whose only
      # consumers were behind `didcomm`; nothing built it, so nothing said so.
      - name: vta-service rest only
        run: cargo clippy -p vta-service --no-default-features --features rest --all-targets -- -D warnings
      # TSP *without* DIDComm — the combination the `tsp = ["didcomm"]` feature
      # edge used to make unbuildable. `-D warnings` for the same reason as the
      # REST-only step above: the dead code this build exposes (DIDComm-only
      # imports, helpers and constants that no longer have a consumer) is
      # exactly what a silent-pass would hide.
      - name: vta-service tsp without didcomm
        run: cargo clippy -p vta-service --no-default-features --features setup,keyring,rest,tsp,cli-synthesis --all-targets -- -D warnings
      - name: vta-service aws-secrets
        run: cargo check -p vta-service --no-default-features --features aws-secrets,keyring,rest
      - name: vta-service azure-secrets
        run: cargo check -p vta-service --no-default-features --features azure-secrets,keyring,rest
      - name: vta-service tsp transport
        run: cargo check -p vta-service --features tsp
      - name: vta-sdk attest-verify
        run: cargo check -p vta-sdk --features attest-verify
      - name: vta-sdk client + sealed-transfer + provision-integration
        run: cargo check -p vta-sdk --features client,sealed-transfer,provision-integration

      # The *maximal* combination. Every step above narrows the feature set;
      # nothing built the top end, and `clippy`/`check` elsewhere in this
      # workflow run `--all-targets` without `--all-features`. So a target
      # gated on two non-default features was never compiled by anything:
      # `vta-sdk/tests/provision_client_e2e.rs` (`provision-client` +
      # `test-support`) sat uncompilable for as long as it took
      # `ProvisionIntegrationRequest.request` to become a `serde_json::Value`.
      #
      # Compiling it is not enough — the same file's auth mock still handed out
      # a 14-char challenge against a `minLength: 16` payload, a *runtime*
      # failure that the identical fixture in `runner_rest.rs`'s unit tests had
      # already been fixed for. So this runs the tests too.
      - name: workspace all-features (lint)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      # `-p vta-sdk`, not the workspace: `vtc-service`'s
      # `*_without_feature_is_config_error` tests assert the error you get when
      # a secrets backend is *not* compiled in, so `--all-features` is the one
      # build where they cannot pass. That is the tests being right about the
      # feature, not a combination worth fixing.
      - name: vta-sdk all-features (test)
        run: cargo test -p vta-sdk --all-features

      # Every step above only *compiles*. The setup wizard's scripted-prompt
      # tests are the one place where a feature flag changes behaviour rather
      # than just what compiles: each secrets backend adds an option to the
      # backend menu, which shifts the answer script. `cargo check` cannot see
      # that, so these two tests sat broken under `config-seed` — the only combo
      # that both adds a backend and is cheap to build — until someone ran it by
      # hand. Run them, don't just build them.
      - name: vta-service setup wizard under extra secrets backends
        run: |
          cargo test -p vta-service --bin vta --features config-seed setup::interactive
          cargo test -p vta-service --bin vta --features config-seed,vault-secrets,k8s-secrets setup::interactive

      # The TEE Mode B carve-out. `tee` is not a default feature of
      # `vta-service`, so `cargo test --workspace` never builds
      # `routes::bootstrap::tests` — and the `cargo check` step above builds
      # the lib only, so it does not even TYPE-CHECK them. That module holds
      # the two properties CLAUDE.md calls load-bearing: exactly one admin is
      # ever minted, and a consumed carve-out refuses with 410 rather than a
      # code that invites a retry. Both were unrunnable in CI. Run them.
      - name: vta-service TEE Mode B carve-out
        run: cargo test -p vta-service --no-default-features --features tee,rest,didcomm --lib routes::bootstrap

      # The fleet (`BAKE_CONFIG=false`) tenant-overlay path. `tenant-overlay` is
      # not a default feature of `vta-tee` and nothing in the default workspace
      # graph turns it on, so `cargo test --workspace` never even COMPILES
      # `vta_tee::tenant_overlay` — the module that decides what an untrusted
      # parent may hand a running enclave. Its envelope parsing, version gate,
      # unknown-field rejection and fail-closed behaviour are exactly the checks
      # that must not rot silently. Run them, don't just build them.
      - name: vta-tee fleet tenant-overlay path
        run: cargo test -p vta-tee --features tenant-overlay tenant_overlay

      # `transport-harness` is not a default feature, so `cargo test
      # --workspace` never compiles `MockVta::start_with_transports` — the
      # harness that exists so an *external* consumer can drive a Trust Task
      # over DIDComm/TSP against the real dispatch spine. Left to the default
      # job, a refactor breaks it silently and the consumer finds out. It also
      # runs a real embedded mediator and a real websocket handshake, so it is
      # a behaviour test, not a compile check — run it, don't just build it.
      - name: vta-service mediator-backed transport harness
        run: cargo test -p vta-service --features transport-harness transport_harness_tests

      # The VTC's TSP **receive** path. `didcomm-harness` is not a default
      # feature, so `cargo test --workspace` never builds this; and compiling
      # `messaging::handle_tsp` was never the problem — it compiled fine
      # throughout the incident that motivated this test. A VTC advertising
      # `#tsp` in a build whose messaging SDK lacked `tsp` dropped every join
      # inside the SDK's websocket transport, below anything the VTC could log.
      # So this runs a real embedded mediator with TSP routing enabled, seals a
      # real CESR frame, and asserts the join lands in the dispatcher: a
      # behaviour test, not a compile check.
      - name: vtc-service TSP receive path over a real mediator
        run: cargo test -p vtc-service --features didcomm-harness --test join_tsp
        env:
          # The admin-UI npm build is irrelevant to the messaging path and adds
          # minutes to this job.
          VTC_SKIP_ADMIN_UI_BUILD: "1"

      # The VTC's trust-registry **send** path — the other direction from the
      # test above, and the one with an extra failure mode: a registry write
      # completes only when a correlated reply comes back through the inbound
      # demux, which is a different code path from the send. A demux that drops
      # the reply is indistinguishable from a registry that never answered
      # (the call times out, the syncer backs off, the queue grows), so the
      # round trip has to be exercised, not just the two halves. Same reasoning
      # as the join tests: `didcomm-harness` is not a default feature, so
      # `cargo test --workspace` never builds this.
      - name: vtc-service trust-registry round trip over a real mediator
        run: cargo test -p vtc-service --features didcomm-harness --test registry_didcomm
        env:
          VTC_SKIP_ADMIN_UI_BUILD: "1"

  enclave:
    # The Nitro enclave binary uses a TEE-only feature combo that the
    # default `check` job never touches. Linux-only because vsock-store
    # depends on `tokio-vsock` which doesn't build on macOS/Windows.
    name: Enclave build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # `apt-get update` is the operation that hangs here — three runs
          # stalled on it, and once each attempt was bounded the timings showed
          # every failure landing on the 90s `update` ceiling, never on the
          # install. The mirror is unresponsive; retrying it harder does not
          # help.
          #
          # So don't run it unless it is actually needed. The runner image ships
          # a usable package index, and pkg-config is already present on
          # ubuntu-24.04, so the fast path is to check what is missing and
          # install straight from the shipped index. Refreshing the index is the
          # fallback, still bounded and retried, for the case where the package
          # genuinely is not in it.
          pkgs=""
          for p in libdbus-1-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
          done
          if [ -z "$pkgs" ]; then
            echo "libdbus-1-dev and pkg-config already present; nothing to do"
            exit 0
          fi
          echo "missing:$pkgs"
          if sudo timeout 120 apt-get install -y $pkgs; then
            exit 0
          fi
          echo "::warning::install from the shipped index failed; refreshing"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::apt-get failed after the shipped index and 3 bounded refreshes"
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          # `target/` is deliberately NOT cached. Every crate in this
          # workspace is a **path** dependency, so a source-only change does not
          # move `Cargo.lock` and therefore does not move this key: the job
          # restores a `target/` built from *other* source and reuses stale
          # artifacts. The failure names a field that is plainly there in the
          # diff, so it reads as the author's bug — see #1133, where a
          # clean-room checkout of the same commit compiled fine.
          #
          # The registry and git caches stay: content-addressed by package
          # version, so a stale entry is impossible by construction.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-enclave-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-enclave-

      - run: cargo check -p vta-enclave --no-default-features --features rest,didcomm,vsock-store
      # The fleet build. `tenant-overlay` pulls in a different module set (the
      # vsock config fetch + apply), so a change that compiles for the baked
      # build can still break the un-baked one.
      - run: cargo check -p vta-enclave --no-default-features --features rest,didcomm,vsock-store,tenant-overlay

  mobile:
    # Cross-compile vta-mobile-core for the iOS + Android targets the app repos
    # consume, and regenerate the UniFFI bindings. The host check/test/clippy
    # jobs only build for the runner's own architecture; without this job a
    # dependency or deployment-target regression that breaks the phone build
    # (e.g. the aws-lc-sys `___chkstk_darwin` iOS link failure this job's
    # deployment-target pin guards against) — or an FFI type that no longer
    # generates bindings — would land green. macOS runner because iOS needs
    # Xcode; the macOS image also ships the Android NDK.
    name: Mobile build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/cache@v6
        with:
          # `target/` is deliberately NOT cached. Every crate in this
          # workspace is a **path** dependency, so a source-only change does not
          # move `Cargo.lock` and therefore does not move this key: the job
          # restores a `target/` built from *other* source and reuses stale
          # artifacts. The failure names a field that is plainly there in the
          # diff, so it reads as the author's bug — see #1133, where a
          # clean-room checkout of the same commit compiled fine.
          #
          # The registry and git caches stay: content-addressed by package
          # version, so a stale entry is impossible by construction.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mobile-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mobile-

      - name: Cross-compile (iOS + Android) and generate bindings
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          ./vta-mobile-core/scripts/build-mobile.sh all
