name: Feature combos setup
description: >
  The shared preamble of every `Feature combos (<group>)` job in ci.yml:
  system packages, the stable toolchain, and the build cache. The job checks the repository out first (this file lives in it).

# One copy instead of five. When `Feature combos` was split into parallel
# groups, each group needed the same three steps, and five hand-kept copies of
# one preamble are how the copies drift. (The apt logic is the case in point:
# it is still copied inline into several other jobs of ci.yml, while this
# action and the Test jobs call the one shared script.)
#
# What is NOT here: anything that decides what a group compiles or tests. Every
# `cargo` step, and the `rustup target add wasm32-unknown-unknown` the rooms
# steps run, stays in the job, verbatim, next to the comment saying why it
# exists.

runs:
  using: composite
  steps:
    # The same bounded, index-first apt logic the other jobs use; see the
    # script header for why `apt-get update` is only the fallback.
    - name: Install system dependencies
      shell: bash
      run: bash scripts/install-build-deps.sh

    # From the runner image's rustup, not dtolnay/rust-toolchain: see the
    # comment on the Clippy job in ci.yml (that action publishes only branches,
    # so there is no immutable ref to pin).
    - name: Install the Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --no-self-update
        rustup default stable

    # mold + compiled third-party crates, keyed per calling job: each group
    # builds its own feature sets, so they never share one (#891).
    - uses: ./.github/actions/rust-cache
