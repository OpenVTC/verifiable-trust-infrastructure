[package]
name = "vti-oob-server"
description = "The approving side of wallet sign-in (auth/oob/*), where a wallet approves a browser's key K_b: the request store, compare-and-set, clocks, long poll and the check order of every step, with the host's gates, signer, audit and redeem result injected as traits"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
async-trait = "0.1"
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
multibase = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
trust-tasks-rs = { workspace = true }
url = { workspace = true }
# `AppError`, `KeyspaceHandle`, `now_epoch`.
vti-common = { path = "../vti-common", version = "0.62" }
# The generated `auth/oob/*` wire types, at the versions
# `vti-specs-core/trust-tasks.toml` pins. Only that family is read.
vti-specs-core = { path = "../vti-specs-core", version = "0.4" }
# The reject/response helpers, `TrustTaskOutcome`, the accepted-id record and
# the freshness policy carried documents are held to.
vti-trust-task-server = { path = "../vti-trust-task-server", version = "0.7" }

[dev-dependencies]
ed25519-dalek = { workspace = true }
hex = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
