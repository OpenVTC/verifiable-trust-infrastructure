[package]
name = "vta-signing"
description = "VTA signing core — Ed25519 and P-256 signatures, JWS and eddsa-jcs-2022 Data Integrity bytes, built in one place for the VTA and for anything that signs as it"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
# Published, because `vta-service` is and depends on it, and because a service
# that signs with its own keys (the agent gateway) depends on it directly. See
# RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
multibase = { workspace = true }
p256 = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = { workspace = true }

[lints]
workspace = true
