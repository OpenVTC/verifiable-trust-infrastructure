[package]
name = "vta-sweepers"
description = "Background TTL sweepers for the VTA's core keyspaces — ACL grant expiry, pending-consent expiry, and soft-deleted-vault purge"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
# Internal to this workspace — consumed through path dependencies only, never
# from crates.io. It was published by inheritance from `[workspace.package]`
# rather than by decision; the audit in #938 found no external consumer. See
# RELEASING.md ("What gets published").
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vti-common = { path = "../vti-common", version = "0.11" }
vta-audit = { path = "../vta-audit", version = "0.1" }
vta-keyspaces = { path = "../vta-keyspaces", version = "0.1" }
vta-vault = { path = "../vta-vault", version = "0.1" }
tracing = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
