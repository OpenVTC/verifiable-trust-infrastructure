[package]
name = "cnm-cli"
description = "CLI Tool for Verified Trust Agents operating in Verified Trust Communities"
version = "0.14.4"
edition.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true

[[bin]]
name = "cnm"
path = "src/main.rs"

[features]
default = ["keyring"]
keyring = ["vta-sdk/keyring"]
config-session = ["vta-sdk/config-session"]
azure-secrets = ["vta-sdk/azure-secrets"]

[dependencies]
vta-sdk = { path = "../vta-sdk", version = "0.37", features = ["session", "crypto-provider", "acl-setup"] }
# `agent-names` powers the global `--resolve-agent-names` flag; without it
# the flag parses but can never resolve anything.
vta-cli-common = { path = "../vta-cli-common", version = "0.15", features = [
  "agent-names",
] }
affinidi-did-resolver-cache-sdk = { workspace = true }
# `cnm vetting …` drives the VTC's vetting admin REST surface through the VTC
# client rather than hand-built requests: it carries the Trust-Task headers,
# finite HTTP timeouts and typed errors the commands turn into guidance.
vtc-client = { path = "../vtc-client", version = "0.6" }
# `cnm vetting bootstrap-pgp`: parse an OpenPGP keyring, verify third-party
# certifications and cleartext-signed link statements.
pgp = { workspace = true }
chrono = { workspace = true }
ratatui = { workspace = true }
clap = { workspace = true, features = ["env"] }
dialoguer = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Direct REST POST for `cnm backup` (the VTC backup routes are REST-only,
# super-admin); forces REST regardless of the session's preferred transport.
reqwest = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The bootstrap tests generate a small web of trust with rPGP, whose key
# generation takes a rand 0.8 RNG (the workspace is on 0.10). A seeded StdRng
# keeps the keys, and so the fingerprints, the same on every run.
rand = "0.8"
tempfile = "3"

[lints]
workspace = true
