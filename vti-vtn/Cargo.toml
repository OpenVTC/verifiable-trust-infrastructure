[package]
name = "vti-vtn"
description = "The Verifiable Trust Network (VTN) protocol: listings, membership, DTG credentials, status lists, network index, group registration, broadcast envelopes, room passes — shared by the VTN service and the VTC"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[features]
default = []
# Talking to a network over HTTPS: `vtn/*` Trust Tasks addressed to the expected
# network DID, and resolving a credential's Bitstring Status List.
# The status-list fetch goes through `vta_sdk::http`'s hardened client and
# address guards (#2662).
client = ["dep:reqwest", "dep:tokio", "dep:vta-sdk", "vta-sdk/http"]
# Resolving a signer's DID (`did:webvh` over the network) and checking its key is authorised
# for the proof's purpose: `resolve::VmKeyResolver`, what a client verifies answers with.
resolve = ["dep:vta-sdk", "dep:affinidi-did-resolver-cache-sdk"]

[dependencies]
affinidi-data-integrity = { workspace = true }
affinidi-secrets-resolver = { workspace = true }
dtg-credentials = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
multibase = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
trust-tasks-rs = { workspace = true }
vti-specs-vtn = { path = "../vti-specs-vtn", version = "0.2" }
thiserror = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
vta-sdk = { path = "../vta-sdk", version = "0.89", default-features = false, features = [
  "proof-verify",
], optional = true }
affinidi-did-resolver-cache-sdk = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
