[package]
name = "vta-policy"
description = "VTA policy subsystem — the regorus (Rego) engine, the default policy bundle, consent model, and decision evaluators"
readme = "README.md"
version = "0.2.2"
edition.workspace = true
# Internal to this workspace — consumed through path dependencies only, never
# from crates.io. It was published by inheritance from `[workspace.package]`
# rather than by decision; the audit in #938 found no external consumer. See
# RELEASING.md ("What gets published").
publish = false
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vti-common = { path = "../vti-common", version = "0.11" }
vta-config = { path = "../vta-config", version = "0.3" }
vta-keyspaces = { path = "../vta-keyspaces", version = "0.1" }
# Types only (default features off): the declarative approvals model + its Rego
# synthesizer, shared with the CLI so both sides derive the same module.
vta-sdk = { path = "../vta-sdk", version = "0.23", default-features = false }
regorus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# `payloadDigest` is a multibase-encoded multihash (`DigestMultibase`), not hex.
multibase = { workspace = true }
serde_json_canonicalizer = "0.3"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
