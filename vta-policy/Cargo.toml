[package]
name = "vta-policy"
description = "VTA policy subsystem — the regorus (Rego) engine, the default policy bundle, consent model, and decision evaluators"
readme = "README.md"
version = "0.2.10"
edition.workspace = true
# Published, because `vta-service` is — and a crate cannot go to crates.io
# without its whole dependency closure there too. Not published for its own
# sake: nothing outside this workspace is expected to depend on it directly.
#
# #938 set `publish = false` here on the finding that no external consumer
# existed. That was wrong by one: `openvtc-core` dev-depends on `vta-service`
# for `test_support::MockVta`, an in-process VTA the OpenVTC end-to-end tests
# run against. See `vta-service/Cargo.toml` for what unpublishing it actually
# broke. See RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vti-common = { path = "../vti-common", version = "0.13" }
vta-config = { path = "../vta-config", version = "0.3" }
vta-keyspaces = { path = "../vta-keyspaces", version = "0.2" }
# Types only (default features off): the declarative approvals model + its Rego
# synthesizer, shared with the CLI so both sides derive the same module.
vta-sdk = { path = "../vta-sdk", version = "0.27", default-features = false }
regorus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# `payloadDigest` is a multibase-encoded multihash (`DigestMultibase`), not hex.
multibase = { workspace = true }
serde_json_canonicalizer = "0.3"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
