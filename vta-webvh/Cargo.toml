[package]
name = "vta-webvh"
description = "WebVH hosting infrastructure for the VTA — the DID-record store, the HTTP client to a did:webvh hosting server, and its DID-auth handshake"
readme = "README.md"
version = "0.2.0"
edition.workspace = true
# Published, because `vta-service` is — and a crate cannot go to crates.io
# without its whole dependency closure there too. Not published for its own
# sake: nothing outside this workspace is expected to depend on it directly.
#
# #938 set `publish = false` here on the finding that no external consumer
# existed. That was wrong by one: `openvtc-core` dev-depends on `vta-service`
# for `test_support::MockVta`, an in-process VTA the OpenVTC end-to-end tests
# run against. See `vta-service/Cargo.toml` for what unpublishing it actually
# broke. See RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vta-keyspaces = { path = "../vta-keyspaces", version = "0.2" }
vti-common = { path = "../vti-common", version = "0.15" }
vta-sdk = { path = "../vta-sdk", version = "0.31" }
affinidi-tdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Not a test-only dependency any more: the host sends `createdAt` as an RFC3339
# string on the DIDComm agent-name listing (its payload schema types it as
# `format: date-time`) and as Unix seconds over REST, so the wire type parses
# both — see `AgentNameEntryWire`.
chrono = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
wiremock = "0.6"
