[package]
name = "vti-trust-task-server"
description = "The receive side of a Trust Task service: size, freshness, recipient, spec policy, proof, sender binding, duplicate-id record, dispatch and signed replies, with an axum handler for POST /v1/trust-tasks"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
tracing = { workspace = true }
trust-tasks-https = { workspace = true }
trust-tasks-rs = { workspace = true }
# The durable accepted-id record's per-id stripe locks (`accepted_store`).
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }
# The proof verifier (`trust_task_proof`) and the shared reject vocabulary
# (`protocols::trust_task_reject_reasons` / `_details`).
vta-sdk = { path = "../vta-sdk", version = "0.88", default-features = false, features = [
  "proof-verify",
] }
# `AppError`, the acceptance window every VTI node applies.
vti-common = { path = "../vti-common", version = "0.64" }

[dev-dependencies]
tempfile = { workspace = true }
ed25519-dalek = { workspace = true }
multibase = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
vta-sdk = { path = "../vta-sdk", version = "0.88", default-features = false, features = [
  "proof-verify",
  "client",
] }

[lints]
workspace = true
