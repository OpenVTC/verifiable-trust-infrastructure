[package]
name = "vta-vault"
description = "VTA holder credential vault — storage, query, receive/verify, present, and status refresh for credentials a holder stores on a VTA"
readme = "README.md"
version = "0.3.2"
edition.workspace = true
# Published, because `vta-service` is — and a crate cannot go to crates.io
# without its whole dependency closure there too. Not published for its own
# sake: nothing outside this workspace is expected to depend on it directly.
#
# #938 set `publish = false` here on the finding that no external consumer
# existed. That was wrong by one: `openvtc-core` dev-depends on `vta-service`
# for `test_support::MockVta`, an in-process VTA the OpenVTC end-to-end tests
# run against. See `vta-service/Cargo.toml` for what unpublishing it actually
# broke. See RELEASING.md ("What gets published").
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# BBS+ (`bbs-2023`) selective-disclosure credentials in the vault — the
# receive/present paths for pseudonym credentials. Pulls in the BLS12-381 curve
# and the `bbs-2023` Data-Integrity cryptosuite. Off by default.
bbs = ["dep:affinidi-bbs", "affinidi-data-integrity/bbs-2023"]
# Holder-side status refresh (`HttpStatusListResolver`) — fetches an issuer's
# BitstringStatusList over HTTP to re-check a held credential's validity.
# Gated because it needs the (SSRF-hardened) foreign-fetch HTTP client, which
# lives behind vta-sdk's `client` feature (`vta_sdk::http`).
webvh = ["dep:reqwest", "vta-sdk/client"]

[dependencies]
vta-keyspaces = { path = "../vta-keyspaces", version = "0.2" }
vti-common = { path = "../vti-common", version = "0.13", features = ["encryption"] }
vta-sdk = { path = "../vta-sdk", version = "0.26", features = ["didcomm", "sealed-transfer"] }
affinidi-crypto = { workspace = true }
affinidi-secrets-resolver = { workspace = true }
affinidi-data-integrity = { workspace = true }
affinidi-sd-jwt = { workspace = true }
affinidi-sd-jwt-vc = { workspace = true }
# ISO 18013-5 mdoc — receive-side verification (issuerAuth COSE_Sign1, MSO
# digests, validityInfo) and the CBOR codec that makes a stored body readable.
affinidi-mdoc = { workspace = true }
coset = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }
affinidi-status-list = { workspace = true }
affinidi-did-resolver-cache-sdk = { workspace = true }
affinidi-bbs = { workspace = true, optional = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
multibase = { workspace = true }
ed25519-dalek = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# Generates the IACA -> Document Signer chains the mdoc trust tests need.
rcgen = { version = "0.13", features = ["x509-parser"] }
tokio = { workspace = true }
tempfile = "3"
